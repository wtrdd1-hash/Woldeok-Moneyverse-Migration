<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <title>Compound interest growth illustration</title>
  <desc>An educational diagram illustrating the conceptual difference between simple and compound growth; figures are not live market measurements.</desc>
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0c1220"/>
      <stop offset="100%" stop-color="#080c14"/>
    </linearGradient>

    <!-- Curve Gradients -->
    <linearGradient id="emeraldCurve" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <linearGradient id="curveFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Card Backgrounds -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Subtle Blueprint Grid Lines -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="1">
    <line x1="80" y1="140" x2="1120" y2="140"/>
    <line x1="80" y1="230" x2="1120" y2="230"/>
    <line x1="80" y1="320" x2="1120" y2="320"/>
    <line x1="80" y1="410" x2="1120" y2="410"/>
    <line x1="80" y1="500" x2="1120" y2="500"/>

    <line x1="240" y1="100" x2="240" y2="520"/>
    <line x1="420" y1="100" x2="420" y2="520"/>
    <line x1="600" y1="100" x2="600" y2="520"/>
    <line x1="780" y1="100" x2="780" y2="520"/>
    <line x1="960" y1="100" x2="960" y2="520"/>
  </g>

  <!-- Header Section -->
  <g transform="translate(80, 56)">
    <!-- Brand Pill -->
    <rect width="180" height="30" rx="15" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.4"/>
    <circle cx="16" cy="15" r="4" fill="#10b981"/>
    <text x="28" y="20" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="0.5">WOLDEOK RESEARCH</text>

    <!-- Main Title -->
    <text x="0" y="62" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" letter-spacing="-0.5">
      The Mathematics of Compounding: Rule of 72 &amp; Exponential Growth
    </text>
  </g>

  <!-- Graph Axis Box (X: 100~820, Y: 150~500) -->
  <g transform="translate(100, 160)">
    <!-- Base Axis Lines -->
    <line x1="0" y1="340" x2="720" y2="340" stroke="#475569" stroke-width="2"/>
    <line x1="0" y1="0" x2="0" y2="340" stroke="#475569" stroke-width="2"/>

    <!-- Y Axis Labels -->
    <text x="-16" y="344" fill="#64748b" font-family="monospace" font-size="12" text-anchor="end">1x (원금)</text>
    <text x="-16" y="244" fill="#64748b" font-family="monospace" font-size="12" text-anchor="end">2x (2배)</text>
    <text x="-16" y="144" fill="#64748b" font-family="monospace" font-size="12" text-anchor="end">4x (4배)</text>
    <text x="-16" y="44" fill="#64748b" font-family="monospace" font-size="12" text-anchor="end">8x (8배)</text>

    <!-- X Axis Labels -->
    <text x="0" y="364" fill="#64748b" font-family="monospace" font-size="12" text-anchor="middle">0년</text>
    <text x="180" y="364" fill="#64748b" font-family="monospace" font-size="12" text-anchor="middle">5년 (청년도약 만기)</text>
    <text x="360" y="364" fill="#64748b" font-family="monospace" font-size="12" text-anchor="middle">9년 (8% 복리 2배)</text>
    <text x="540" y="364" fill="#64748b" font-family="monospace" font-size="12" text-anchor="middle">18년 (4배 달성)</text>
    <text x="700" y="364" fill="#64748b" font-family="monospace" font-size="12" text-anchor="middle">27년 (8배 폭발)</text>

    <!-- Curve Fill Area -->
    <path d="M 0,340 Q 240,320 360,240 T 700,20 L 700,340 Z" fill="url(#curveFill)"/>

    <!-- Simple Interest Line (Linear, Amber) -->
    <line x1="0" y1="340" x2="700" y2="210" stroke="#f59e0b" stroke-width="3" stroke-dasharray="6,4"/>
    <text x="680" y="195" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="13" font-weight="700">단리 성장선 (선형)</text>

    <!-- Compound Interest Curve (Exponential, Emerald) -->
    <path d="M 0,340 Q 240,320 360,240 T 700,20" fill="none" stroke="url(#emeraldCurve)" stroke-width="5" filter="url(#glow)"/>

    <!-- Key Milestone Dots -->
    <!-- Milestone 1: 5 Year Youth Leap -->
    <circle cx="180" cy="305" r="6" fill="#38bdf8" stroke="#0f172a" stroke-width="2"/>
    <line x1="180" y1="305" x2="180" y2="340" stroke="#38bdf8" stroke-dasharray="2,2"/>
    <g transform="translate(130, 260)">
      <rect width="130" height="34" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.6"/>
      <text x="65" y="16" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">청년도약계좌</text>
      <text x="65" y="28" fill="#f8fafc" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">5,042만 원 완성</text>
    </g>

    <!-- Milestone 2: 9 Year 2x Doubling (Rule of 72) -->
    <circle cx="360" cy="240" r="7" fill="#10b981" stroke="#f8fafc" stroke-width="2"/>
    <line x1="360" y1="240" x2="360" y2="340" stroke="#10b981" stroke-dasharray="2,2"/>
    <g transform="translate(300, 185)">
      <rect width="140" height="42" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
      <text x="70" y="18" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle">72의 법칙 (R=8%)</text>
      <text x="70" y="34" fill="#f8fafc" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">원금 200% 도달</text>
    </g>

    <!-- Milestone 3: 27 Year 8x Snowball Peak -->
    <circle cx="700" cy="20" r="8" fill="#34d399" stroke="#f8fafc" stroke-width="3" filter="url(#glow)"/>
    <g transform="translate(560, 40)">
      <rect width="140" height="42" rx="6" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
      <text x="70" y="18" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle">복리 스노우볼 폭발</text>
      <text x="70" y="34" fill="#f8fafc" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">원금 대비 800%+</text>
    </g>
  </g>

  <!-- Right Metric Intelligence Panel -->
  <g transform="translate(860, 160)">
    <!-- Panel 1: Formula Card -->
    <rect width="260" height="105" rx="12" fill="url(#cardBg)" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="32" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">수학적 증명 공식</text>
    <text x="20" y="60" fill="#38bdf8" font-family="monospace" font-size="20" font-weight="800">t ≈ 72 ÷ R (%)</text>
    <text x="20" y="86" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Taylor Series ln(1+r) ≈ r 1차 근사</text>

    <!-- Panel 2: DRIP Snowball Multiplier -->
    <g transform="translate(0, 120)">
      <rect width="260" height="105" rx="12" fill="url(#cardBg)" stroke="#10b981" stroke-opacity="0.4" stroke-width="1.5"/>
      <text x="20" y="32" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="700">배당 재투자(DRIP) 복리 효과</text>
      <text x="20" y="64" fill="#10b981" font-family="monospace" font-size="24" font-weight="900">6.8배 <tspan fill="#64748b" font-size="14" font-weight="500">vs 단리 2.1배</tspan></text>
      <text x="20" y="90" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">20년 누적 재투자 시 3배 이상 초과 격차</text>
    </g>

    <!-- Panel 3: Tax Advantage Benefit -->
    <g transform="translate(0, 240)">
      <rect width="260" height="105" rx="12" fill="url(#cardBg)" stroke="#334155" stroke-width="1.5"/>
      <text x="20" y="32" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">정부 지원 &amp; 비과세 세이브</text>
      <text x="20" y="64" fill="#f59e0b" font-family="monospace" font-size="22" font-weight="800">+328만 WLD</text>
      <text x="20" y="90" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">정부 기여금 198만 + 이자소득세 비과세</text>
    </g>
  </g>

  <!-- Footer Watermark / Data Credibility Tag -->
  <g transform="translate(80, 585)">
    <text x="0" y="0" fill="#475569" font-family="system-ui, sans-serif" font-size="12">
      데이터 근거: 한국은행 ECOS · FRED · Yahoo Finance 실시간 거시경제 텔레메트리 연동 분석
    </text>
    <text x="1040" y="0" fill="#64748b" font-family="monospace" font-size="12" text-anchor="end">
      Ver. 2026.10.14 · Woldeok Financial AI
    </text>
  </g>
</svg>
