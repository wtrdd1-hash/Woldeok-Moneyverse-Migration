<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <title>Distributed Ledger Integrity and Exact Accounting</title>
  <desc>Software architecture diagram of double-entry ledger balance verification, BigInt integer arithmetic, and SSRF security defense.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a14"/>
      <stop offset="50%" stop-color="#121124"/>
      <stop offset="100%" stop-color="#07070d"/>
    </linearGradient>
    <linearGradient id="purpleNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="cyanNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Code Matrix Grid -->
  <g opacity="0.08" stroke="#a855f7" stroke-width="1">
    <line x1="80" y1="130" x2="1120" y2="130"/>
    <line x1="80" y1="240" x2="1120" y2="240"/>
    <line x1="80" y1="350" x2="1120" y2="350"/>
    <line x1="80" y1="460" x2="1120" y2="460"/>
    <line x1="300" y1="90" x2="300" y2="560"/>
    <line x1="600" y1="90" x2="600" y2="560"/>
    <line x1="900" y1="90" x2="900" y2="560"/>
  </g>

  <!-- Header -->
  <text x="80" y="70" fill="#a855f7" font-family="system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="2">FINTECH ARCHITECTURE &amp; LEDGER VERIFICATION</text>
  <text x="80" y="105" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="28" font-weight="900">분산 원장 무결성과 BigInt 정밀 회계 아키텍처</text>
  <text x="80" y="132" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14">부동소수점 오차 제로화, 복식부기 원장 불변성 검증 및 SSRF 방어 파이프라인</text>

  <!-- 3 Node Architecture Cards -->
  <g transform="translate(80, 160)">
    <!-- Node 1: BigInt Engine -->
    <rect width="320" height="150" rx="14" fill="url(#cardBg)" stroke="#4338ca"/>
    <text x="20" y="34" fill="#a855f7" font-family="system-ui, sans-serif" font-size="13" font-weight="700">1. 정밀 산술 엔진</text>
    <text x="20" y="68" fill="#f8fafc" font-family="monospace" font-size="22" font-weight="800">BigInt Fixed-Point</text>
    <text x="20" y="98" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">부동소수점(IEEE 754) 오차 방지</text>
    <text x="20" y="120" fill="#34d399" font-family="monospace" font-size="11">✓ Decimal Precision: 18 Decimals</text>

    <!-- Node 2: Immutable Journal -->
    <g transform="translate(360, 0)">
      <rect width="320" height="150" rx="14" fill="url(#cardBg)" stroke="#4338ca"/>
      <text x="20" y="34" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="700">2. 불변 복식부기 원장</text>
      <text x="20" y="68" fill="#f8fafc" font-family="monospace" font-size="22" font-weight="800">Double-Entry Ledger</text>
      <text x="20" y="98" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">차변(Debit) = 대변(Credit) 일치</text>
      <text x="20" y="120" fill="#34d399" font-family="monospace" font-size="11">✓ Unbalanced Entries: 0 Count</text>
    </g>

    <!-- Node 3: SSRF & Security Shield -->
    <g transform="translate(720, 0)">
      <rect width="320" height="150" rx="14" fill="url(#cardBg)" stroke="#4338ca"/>
      <text x="20" y="34" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="13" font-weight="700">3. 제로 트러스트 보안</text>
      <text x="20" y="68" fill="#f8fafc" font-family="monospace" font-size="22" font-weight="800">DNS Pinning &amp; SSRF</text>
      <text x="20" y="98" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">클라우드 메타데이터(IMDSv2) 보호</text>
      <text x="20" y="120" fill="#34d399" font-family="monospace" font-size="11">✓ Private Range Blocked: 100%</text>
    </g>
  </g>

  <!-- Flow Visualizer -->
  <g transform="translate(80, 340)">
    <rect width="1040" height="210" rx="16" fill="url(#cardBg)" stroke="#334155"/>
    <text x="24" y="32" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14" font-weight="700">트랜잭션 검증 파이프라인 (Atomic Consensus)</text>

    <!-- Blocks -->
    <rect x="50" y="70" width="250" height="80" rx="10" fill="#1e1b4b" stroke="#6366f1"/>
    <text x="70" y="105" fill="#c7d2fe" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">입력 트랜잭션 수신</text>
    <text x="70" y="128" fill="#818cf8" font-family="monospace" font-size="11">Signature / Nonce Verify</text>

    <!-- Arrow 1 -->
    <path d="M 315,110 L 375,110" stroke="#818cf8" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="390" y="70" width="250" height="80" rx="10" fill="#1e1b4b" stroke="#6366f1"/>
    <text x="410" y="105" fill="#c7d2fe" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">원장 대차대조표 대사</text>
    <text x="410" y="128" fill="#818cf8" font-family="monospace" font-size="11">SUM(Debit) == SUM(Credit)</text>

    <!-- Arrow 2 -->
    <path d="M 655,110 L 715,110" stroke="#818cf8" stroke-width="3"/>

    <rect x="730" y="70" width="260" height="80" rx="10" fill="#1e1b4b" stroke="#10b981"/>
    <text x="750" y="105" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">영구 블록체인 원장 기록</text>
    <text x="750" y="128" fill="#34d399" font-family="monospace" font-size="11">Immutable Journal Append</text>
  </g>

  <text x="80" y="585" fill="#64748b" font-family="monospace" font-size="11">WOLDEOK SOFTWARE ARCHITECTURE RESEARCH · PLATFORM CORE DIVISION</text>
  <text x="1120" y="585" text-anchor="end" fill="#64748b" font-family="monospace" font-size="11">AUDIT PROOF RECEIPT: CRYPTO_VERIFIED</text>
</svg>
