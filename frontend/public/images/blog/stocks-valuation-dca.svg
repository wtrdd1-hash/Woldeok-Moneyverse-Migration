<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <title>Stock Valuation and DCA Averaging Strategy</title>
  <desc>Quantitative stock evaluation metrics, dollar-cost averaging simulations, and order book dynamics.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1215"/>
      <stop offset="50%" stop-color="#0f1f26"/>
      <stop offset="100%" stop-color="#070c0e"/>
    </linearGradient>
    <linearGradient id="cyanLine" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0891b2"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#67e8f9"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#164e63" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Grid -->
  <g opacity="0.1" stroke="#06b6d4" stroke-width="1">
    <line x1="80" y1="130" x2="1120" y2="130"/>
    <line x1="80" y1="240" x2="1120" y2="240"/>
    <line x1="80" y1="350" x2="1120" y2="350"/>
    <line x1="80" y1="460" x2="1120" y2="460"/>
    <line x1="340" y1="90" x2="340" y2="560"/>
    <line x1="600" y1="90" x2="600" y2="560"/>
    <line x1="860" y1="90" x2="860" y2="560"/>
  </g>

  <!-- Header -->
  <text x="80" y="70" fill="#22d3ee" font-family="system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="2">EQUITY VALUATION &amp; DCA ENGINE</text>
  <text x="80" y="105" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="28" font-weight="900">가치평가(PER·PBR)와 주식 물타기(DCA) 손익분기 모델</text>
  <text x="80" y="132" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14">하락장 평단가 최적화, 10단 호가창 유동성 깊이 및 밸류에이션 밴드</text>

  <!-- Metrics -->
  <g transform="translate(80, 160)">
    <rect width="320" height="110" rx="14" fill="url(#cardBg)" stroke="#0e7490"/>
    <text x="20" y="34" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">평균 단가 인하 효과 (DCA)</text>
    <text x="20" y="72" fill="#22d3ee" font-family="monospace" font-size="28" font-weight="800">-34.8% 절감</text>
    <text x="20" y="96" fill="#67e8f9" font-family="system-ui, sans-serif" font-size="11">분할 매수를 통한 손익분기점 조기 도달</text>

    <g transform="translate(360, 0)">
      <rect width="320" height="110" rx="14" fill="url(#cardBg)" stroke="#0e7490"/>
      <text x="20" y="34" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">타깃 포워드 PER</text>
      <text x="20" y="72" fill="#38bdf8" font-family="monospace" font-size="28" font-weight="800">12.4배</text>
      <text x="20" y="96" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">동종 업계 평균(18.2배) 대비 저평가</text>
    </g>

    <g transform="translate(720, 0)">
      <rect width="320" height="110" rx="14" fill="url(#cardBg)" stroke="#0e7490"/>
      <text x="20" y="34" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">자기자본이익률 (ROE)</text>
      <text x="20" y="72" fill="#34d399" font-family="monospace" font-size="28" font-weight="800">18.6%</text>
      <text x="20" y="96" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="11">우량 현금흐름 창출 기업 펀더멘털</text>
    </g>
  </g>

  <!-- Visual Section -->
  <g transform="translate(80, 300)">
    <rect width="1040" height="250" rx="16" fill="url(#cardBg)" stroke="#0e7490"/>
    <text x="24" y="32" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14" font-weight="700">주가 변동성 궤적과 분할 매수 평단가 추세선</text>

    <!-- Price fluctuations -->
    <path d="M 50,150 Q 200,60 350,180 T 650,90 T 980,120" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="3,3"/>
    <text x="880" y="105" fill="#94a3b8" font-family="monospace" font-size="11">시장 가격 (Volatile)</text>

    <!-- DCA Average Line -->
    <path d="M 50,160 Q 300,170 550,140 T 980,95" fill="none" stroke="url(#cyanLine)" stroke-width="4"/>
    <circle cx="980" cy="95" r="7" fill="#22d3ee"/>
    <text x="840" y="80" fill="#22d3ee" font-family="monospace" font-size="12" font-weight="bold">최종 평단가 (DCA Target)</text>
  </g>

  <text x="80" y="585" fill="#64748b" font-family="monospace" font-size="11">WOLDEOK EQUITY QUANT RESEARCH · QUANT LAB</text>
  <text x="1120" y="585" text-anchor="end" fill="#64748b" font-family="monospace" font-size="11">VALUATION MATRIX v2026</text>
</svg>
