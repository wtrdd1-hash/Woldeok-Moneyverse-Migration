<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <title>Global Macroeconomic and Forex Pulse Indicator</title>
  <desc>Educational visualization of macroeconomic benchmark pulse, interest rate divergence, and currency exchange models.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0d1527"/>
      <stop offset="100%" stop-color="#080c18"/>
    </linearGradient>
    <linearGradient id="blueCurve" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="amberCurve" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Blueprint Grid -->
  <g opacity="0.1" stroke="#38bdf8" stroke-width="1">
    <line x1="80" y1="130" x2="1120" y2="130"/>
    <line x1="80" y1="230" x2="1120" y2="230"/>
    <line x1="80" y1="330" x2="1120" y2="330"/>
    <line x1="80" y1="430" x2="1120" y2="430"/>
    <line x1="80" y1="530" x2="1120" y2="530"/>
    <line x1="260" y1="90" x2="260" y2="560"/>
    <line x1="480" y1="90" x2="480" y2="560"/>
    <line x1="700" y1="90" x2="700" y2="560"/>
    <line x1="920" y1="90" x2="920" y2="560"/>
  </g>

  <!-- Header Section -->
  <text x="80" y="70" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="2">GLOBAL MACRO RESEARCH PULSE</text>
  <text x="80" y="105" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="28" font-weight="900">2026 글로벌 거시경제 펄스 &amp; 환율 밸류에이션 모델</text>
  <text x="80" y="132" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14">한미 정책금리 역전차(1.75%p), 외환 스왑레이트 및 인플레이션 기대치 정밀 시각화</text>

  <!-- Metric Badges -->
  <g transform="translate(80, 160)">
    <!-- Metric 1: USD/KRW -->
    <rect width="230" height="100" rx="12" fill="url(#cardGrad)" stroke="#334155"/>
    <text x="18" y="32" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">USD/KRW 환율 기준</text>
    <text x="18" y="65" fill="#f8fafc" font-family="monospace" font-size="24" font-weight="800">1,385.50원</text>
    <text x="18" y="88" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">중립선 1,350원 상회</text>

    <!-- Metric 2: Fed Rate -->
    <g transform="translate(250, 0)">
      <rect width="230" height="100" rx="12" fill="url(#cardGrad)" stroke="#334155"/>
      <text x="18" y="32" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">미 연준 기준금리 (Fed)</text>
      <text x="18" y="65" fill="#f59e0b" font-family="monospace" font-size="24" font-weight="800">4.75%</text>
      <text x="18" y="88" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">중립 목표 3.00% 대비 긴축</text>
    </g>

    <!-- Metric 3: BOK Rate -->
    <g transform="translate(500, 0)">
      <rect width="230" height="100" rx="12" fill="url(#cardGrad)" stroke="#334155"/>
      <text x="18" y="32" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">한국은행 기준금리 (BOK)</text>
      <text x="18" y="65" fill="#3b82f6" font-family="monospace" font-size="24" font-weight="800">3.00%</text>
      <text x="18" y="88" fill="#ef4444" font-family="system-ui, sans-serif" font-size="11" font-weight="700">금리 역전차 -1.75%p</text>
    </g>

    <!-- Metric 4: S&P 500 -->
    <g transform="translate(750, 0)">
      <rect width="290" height="100" rx="12" fill="url(#cardGrad)" stroke="#334155"/>
      <text x="18" y="32" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">미국 S&amp;P 500 지수</text>
      <text x="18" y="65" fill="#10b981" font-family="monospace" font-size="24" font-weight="800">5,815.40 pt</text>
      <text x="18" y="88" fill="#10b981" font-family="system-ui, sans-serif" font-size="11" font-weight="600">빅테크 주도 역사적 고점</text>
    </g>
  </g>

  <!-- Center Chart Area -->
  <g transform="translate(80, 290)">
    <!-- Chart Box -->
    <rect width="1040" height="260" rx="16" fill="url(#cardGrad)" stroke="#334155"/>
    <text x="24" y="32" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14" font-weight="700">통화정책 전이 경로와 외환 유동성 밴드 시뮬레이션</text>
    
    <!-- Wave Curves -->
    <path d="M 40,180 Q 200,90 400,140 T 750,110 T 1000,70" fill="none" stroke="url(#blueCurve)" stroke-width="4"/>
    <path d="M 40,210 Q 250,190 450,170 T 800,160 T 1000,130" fill="none" stroke="url(#amberCurve)" stroke-width="3" stroke-dasharray="6,4"/>

    <!-- Key Milestone Pins -->
    <circle cx="400" cy="140" r="6" fill="#3b82f6"/>
    <text x="360" y="125" fill="#93c5fd" font-family="monospace" font-size="11">한미 금리차 확대</text>

    <circle cx="750" cy="110" r="6" fill="#60a5fa"/>
    <text x="710" y="95" fill="#93c5fd" font-family="monospace" font-size="11">중립금리 도달점</text>

    <circle cx="1000" cy="70" r="7" fill="#34d399"/>
    <text x="940" y="55" fill="#6ee7b7" font-family="monospace" font-size="12" font-weight="bold">인플레 안정화 타깃</text>

    <!-- Legend -->
    <g transform="translate(740, 220)">
      <circle cx="10" cy="10" r="5" fill="#3b82f6"/>
      <text x="24" y="14" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">글로벌 무위험 이자율</text>
      <circle cx="170" cy="10" r="5" fill="#f59e0b"/>
      <text x="184" y="14" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">국내 기준금리 궤적</text>
    </g>
  </g>

  <!-- Footer Watermark / Signature -->
  <text x="80" y="590" fill="#64748b" font-family="monospace" font-size="11">WOLDEOK RESEARCH INSTITUTE · QUANTITATIVE MACRO DIVISION</text>
  <text x="1120" y="590" text-anchor="end" fill="#64748b" font-family="monospace" font-size="11">DATA SOURCE: BOK ECOS · FRED · YAHOO FINANCE</text>
</svg>
