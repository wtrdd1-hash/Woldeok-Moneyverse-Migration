<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <title>Wealth Accumulation and Asset Allocation Roadmap</title>
  <desc>Quantitative asset allocation model illustrating 10-year wealth trajectories across multi-asset classes.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c101c"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="wealthGreen" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Blueprint Grid -->
  <g opacity="0.1" stroke="#34d399" stroke-width="1">
    <line x1="80" y1="130" x2="1120" y2="130"/>
    <line x1="80" y1="240" x2="1120" y2="240"/>
    <line x1="80" y1="350" x2="1120" y2="350"/>
    <line x1="80" y1="460" x2="1120" y2="460"/>
    <line x1="340" y1="90" x2="340" y2="560"/>
    <line x1="600" y1="90" x2="600" y2="560"/>
    <line x1="860" y1="90" x2="860" y2="560"/>
  </g>

  <!-- Header -->
  <text x="80" y="70" fill="#34d399" font-family="system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="2">ASSET ALLOCATION &amp; WEALTH ROADMAP</text>
  <text x="80" y="105" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="28" font-weight="900">생애주기 자산배분과 10억 목돈 달성 알고리즘</text>
  <text x="80" y="132" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14">글로벌 분산투자, 정액적립(DCA) 및 몬테카를로 자산 경로 시뮬레이션</text>

  <!-- 3 Big Metric Cards -->
  <g transform="translate(80, 160)">
    <rect width="320" height="110" rx="14" fill="url(#cardBg)" stroke="#334155"/>
    <text x="20" y="34" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">목표 자산 (10년 시뮬레이션)</text>
    <text x="20" y="72" fill="#34d399" font-family="monospace" font-size="28" font-weight="800">1,000,000,000원</text>
    <text x="20" y="96" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="11">월 150만 원 적립 + 연 8.5% 복리</text>

    <g transform="translate(360, 0)">
      <rect width="320" height="110" rx="14" fill="url(#cardBg)" stroke="#334155"/>
      <text x="20" y="34" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">누적 복리 수익률</text>
      <text x="20" y="72" fill="#38bdf8" font-family="monospace" font-size="28" font-weight="800">+112.5%</text>
      <text x="20" y="96" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">순수 원금 대비 지수함수 이자 초과</text>
    </g>

    <g transform="translate(720, 0)">
      <rect width="320" height="110" rx="14" fill="url(#cardBg)" stroke="#334155"/>
      <text x="20" y="34" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">비과세 절세 절감액</text>
      <text x="20" y="72" fill="#f59e0b" font-family="monospace" font-size="28" font-weight="800">42,500,000원</text>
      <text x="20" y="96" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="11">ISA + 연금저축 과세이연 재투자</text>
    </g>
  </g>

  <!-- Growth Curves Section -->
  <g transform="translate(80, 300)">
    <rect width="1040" height="250" rx="16" fill="url(#cardBg)" stroke="#334155"/>
    <text x="24" y="32" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14" font-weight="700">원금 누적선 vs 복리 가속 곡선 (Exponential Divergence)</text>

    <!-- Linear Principal Line -->
    <line x1="50" y1="200" x2="980" y2="130" stroke="#64748b" stroke-width="3" stroke-dasharray="4,4"/>
    <text x="860" y="125" fill="#94a3b8" font-family="monospace" font-size="11">납입 원금 (Linear)</text>

    <!-- Exponential Wealth Curve -->
    <path d="M 50,200 Q 400,180 650,110 T 980,40" fill="none" stroke="url(#wealthGreen)" stroke-width="5"/>
    <circle cx="980" cy="40" r="7" fill="#34d399"/>
    <text x="840" y="35" fill="#34d399" font-family="monospace" font-size="13" font-weight="bold">10억 돌파 시점 (Exponential)</text>

    <!-- Year markers -->
    <g transform="translate(50, 220)" fill="#64748b" font-family="monospace" font-size="11">
      <text x="0" y="0">0년차</text>
      <text x="300" y="0">3년차</text>
      <text x="600" y="0">7년차</text>
      <text x="910" y="0">10년차 (복리 폭발기)</text>
    </g>
  </g>

  <text x="80" y="585" fill="#64748b" font-family="monospace" font-size="11">WOLDEOK RESEARCH INSTITUTE · ASSET MANAGEMENT DIVISION</text>
  <text x="1120" y="585" text-anchor="end" fill="#64748b" font-family="monospace" font-size="11">MONTE CARLO ASSET SIMULATOR v2026</text>
</svg>
