name: wdmv

# The migration deployment. Five containers and one external network.
#
# Only `edge` is reachable from outside the stack: it is the single member of
# the Cloudflare tunnel's network, and it is what decides that `/socket.io/`
# belongs to the API while everything else belongs to Next. The API is never
# published, because the browser is not supposed to reach it directly — that
# is what keeps the session a same-origin HttpOnly cookie.
#
# Images are built on this host rather than pulled. The host has 16 cores and
# spare memory, a warm rebuild takes about a second, and building here means
# the deployment needs no registry, no package, and no pull credential.

services:
  db:
    image: postgres:17.5-alpine
    container_name: wdmv-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: moneyverse_migrator
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: ${DB_NAME:?required}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?required}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U moneyverse_migrator -d ${DB_NAME}']
      interval: 5s
      timeout: 5s
      retries: 20

  # Runs to completion on every deploy. migrate.sh records a sha256 per file
  # and refuses one that changed, so re-running it is safe and applying a new
  # migration needs no separate step.
  migrate:
    image: postgres:17.5-alpine
    container_name: wdmv-migrate
    restart: 'no'
    environment:
      PGHOST: db
      PGPORT: 5432
      PGUSER: moneyverse_migrator
      PGPASSWORD: ${POSTGRES_PASSWORD:?required}
      PGDATABASE: ${DB_NAME:?required}
    volumes:
      - ./migrations:/migrations:ro
      - ./migrate.sh:/usr/local/bin/migrate.sh:ro
    entrypoint: ['/bin/sh', '/usr/local/bin/migrate.sh']
    depends_on:
      db:
        condition: service_healthy

  backend:
    build:
      context: ./src
      dockerfile: backend/Dockerfile
    image: wdmv/backend:latest
    container_name: wdmv-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      # The application connects as the least-privileged role, never as the
      # migrator that owns the schema.
      DATABASE_URL: postgresql://moneyverse_app:${APP_DB_PASSWORD:?required}@db:5432/${DB_NAME:?required}
      APP_BASE_URL: ${APP_BASE_URL:?required}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?required}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      # True because there is a reverse proxy in front that rewrites it. With
      # it false the rate limiter would count the proxy once for everybody.
      TRUST_PROXY_X_FORWARDED_FOR: ${TRUST_PROXY_X_FORWARDED_FOR:-true}
      SEO_INDEXING_ENABLED: ${SEO_INDEXING_ENABLED:-false}
      ADS_ENABLED: ${ADS_ENABLED:-false}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      DISCORD_REDIRECT_URI: ${DISCORD_REDIRECT_URI:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      PHOTO_STORAGE_DIR: /data/moneyverse/photos
    volumes:
      - photo-data:/data/moneyverse/photos
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'node', '-e', "require('http').get('http://127.0.0.1:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  frontend:
    build:
      context: ./src
      dockerfile: frontend/Dockerfile
      args:
        # Baked in because robots.txt and sitemap.xml are generated during the
        # build and have to name the public host.
        APP_BASE_URL: ${APP_BASE_URL:?required}
        SEO_INDEXING_ENABLED: ${SEO_INDEXING_ENABLED:-false}
    image: wdmv/frontend:latest
    container_name: wdmv-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      # Internal only. The browser never uses this address.
      API_ORIGIN: http://backend:3000
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?required}
      APP_BASE_URL: ${APP_BASE_URL:?required}
      SEO_INDEXING_ENABLED: ${SEO_INDEXING_ENABLED:-false}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '-e', "require('http').get('http://127.0.0.1:3000/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  edge:
    image: nginx:1.27-alpine
    container_name: wdmv-edge
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
    # Published on loopback as well, so an operator on the host can check the
    # site without going out through Cloudflare and back.
    ports:
      - '127.0.0.1:${EDGE_PORT:-3021}:80'
    networks:
      default:
      tunnel:
        aliases: [wdmv]

volumes:
  db-data:
  photo-data:

networks:
  # The Cloudflare tunnel's own network. Joining it is what lets the tunnel
  # resolve `wdmv` — nothing here is published to the internet directly.
  tunnel:
    external: true
    name: wtrdd-edge
