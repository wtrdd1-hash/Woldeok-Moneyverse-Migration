name: ${STACK:-wdmv}

# One deployment of the rebuild. Six containers and one external network, plus
# `backup`, which is behind a profile and runs only for the length of one
# `docker compose run`.
#
# The same file runs twice on this host: STACK=wdmv is the test deployment at
# test.easy-scraping.com, STACK=wdmvp is production at easy-scraping.com. The
# stack name prefixes every container and is the alias the Cloudflare tunnel
# resolves, so the two are separate projects with separate volumes, separate
# databases and separate secrets, from one file.
#
# Only `edge` is reachable from outside the stack: it is the single member of
# the Cloudflare tunnel's network, and it is what decides that `/socket.io/`
# belongs to the API while everything else belongs to Next. The API is never
# published, because the browser is not supposed to reach it directly — that
# is what keeps the session a same-origin HttpOnly cookie.
#
# Images are built by Actions and pulled here, tagged with the commit that
# produced them. `docker compose build` still works for a local experiment,
# but a deploy never uses it: the tag is what makes a rollback one edited
# line in .env instead of a rebuild.

services:
  db:
    image: postgres:17.11-alpine
    container_name: ${STACK:-wdmv}-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: moneyverse_migrator
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: ${DB_NAME:?required}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?required}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U moneyverse_migrator -d ${DB_NAME}']
      interval: 5s
      timeout: 5s
      retries: 20

  # Runs to completion on every deploy. migrate.sh records a sha256 per file
  # and refuses one that changed, so re-running it is safe and applying a new
  # migration needs no separate step.
  migrate:
    image: postgres:17.11-alpine
    container_name: ${STACK:-wdmv}-migrate
    restart: 'no'
    environment:
      PGHOST: db
      PGPORT: 5432
      PGUSER: moneyverse_migrator
      PGPASSWORD: ${POSTGRES_PASSWORD:?required}
      PGDATABASE: ${DB_NAME:?required}
    volumes:
      - ./migrations:/migrations:ro
      - ./migrate.sh:/usr/local/bin/migrate.sh:ro
    entrypoint: ['/bin/sh', '/usr/local/bin/migrate.sh']
    depends_on:
      db:
        condition: service_healthy

  # Per-deployment configuration a migration must not carry: the status
  # collector's credential, and the administrator list that differs between
  # this deployment and the other one. Runs to completion on every deploy and
  # is idempotent.
  seed:
    image: postgres:17.11-alpine
    container_name: ${STACK:-wdmv}-seed
    restart: 'no'
    environment:
      PGHOST: db
      PGPORT: 5432
      PGUSER: moneyverse_migrator
      PGPASSWORD: ${POSTGRES_PASSWORD:?required}
      PGDATABASE: ${DB_NAME:?required}
      STATUS_COLLECTOR_PASSWORD: ${STATUS_COLLECTOR_PASSWORD:-}
      RECONCILER_PASSWORD: ${RECONCILER_PASSWORD:-}
      BACKUP_DB_PASSWORD: ${BACKUP_DB_PASSWORD:-}
      BOOTSTRAP_DISCORD_ADMIN_IDS: ${BOOTSTRAP_DISCORD_ADMIN_IDS:-}
    volumes:
      - ./seed.sh:/usr/local/bin/seed.sh:ro
    entrypoint: ['/bin/sh', '/usr/local/bin/seed.sh']
    depends_on:
      migrate:
        condition: service_completed_successfully

  # One command's worth of database reader, for deploy/backup.sh. A profile
  # keeps it out of `docker compose up` entirely; `docker compose run` enables
  # the profile of the service it is given, so nothing else has to.
  #
  # It exists so a dump runs as `moneyverse_backup` -- a member of
  # pg_read_all_data and nothing else -- rather than as the migrator that owns
  # the schema, and so the credential reaches pg_dump through this file's
  # environment instead of a command line every process on the host can read in
  # `ps`. See deploy/seed.sh for the role.
  #
  # It writes nothing itself. The dump goes to stdout, and backup.sh compresses
  # and encrypts it on the host, which is what keeps BACKUP_ENCRYPTION_KEY out
  # of every container and the plaintext dump off disk.
  backup:
    image: postgres:17.11-alpine
    profiles: [backup]
    restart: 'no'
    # No container_name: `run` would reuse it for every invocation, so one
    # abandoned container would block every later backup.
    #
    # The image's entrypoint execs anything that is not `postgres` as whoever
    # the container runs as, which is root unless it is told otherwise. Nothing
    # pg_dump does here needs root.
    user: postgres
    environment:
      PGHOST: db
      PGPORT: 5432
      PGUSER: moneyverse_backup
      # No `:?required`: this file is interpolated for every `docker compose`
      # call, so demanding it here would break `ps` and `logs` on a deployment
      # that takes no backups. An unset value fails inside psql instead, where
      # the message names the credential.
      PGPASSWORD: ${BACKUP_DB_PASSWORD:-}
      PGDATABASE: ${DB_NAME:?required}
    depends_on:
      db:
        condition: service_healthy

  # The backup role's login, on its own. `seed` establishes it too, but `seed`
  # waits on `migrate` -- and the whole point of the dump roll.sh takes is that
  # it happens before a migration runs. So the one piece of seeding a dump
  # needs is reachable without the rest, from the same script and the same
  # idempotent block.
  #
  # No container_name, for the reason the `backup` service gives.
  backup-credential:
    image: postgres:17.11-alpine
    profiles: [backup]
    restart: 'no'
    environment:
      PGHOST: db
      PGPORT: 5432
      PGUSER: moneyverse_migrator
      PGPASSWORD: ${POSTGRES_PASSWORD:?required}
      PGDATABASE: ${DB_NAME:?required}
      BACKUP_DB_PASSWORD: ${BACKUP_DB_PASSWORD:-}
      SEED_ONLY: backup-credential
    volumes:
      - ./seed.sh:/usr/local/bin/seed.sh:ro
    entrypoint: ['/bin/sh', '/usr/local/bin/seed.sh']
    depends_on:
      db:
        condition: service_healthy

  backend:
    # No `:?required`: an unset value would make every later `docker compose`
    # call fail, including `ps` and `logs`, which is exactly when an operator
    # needs them. roll.sh writes the resolved reference into .env.
    image: ${BACKEND_IMAGE:-ghcr.io/wtrdd1-hash/wdmv/backend:latest-test}
    container_name: ${STACK:-wdmv}-backend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 512
    mem_limit: 1g
    memswap_limit: 2g
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      # The application connects as the least-privileged role, never as the
      # migrator that owns the schema.
      DATABASE_URL: postgresql://moneyverse_app:${APP_DB_PASSWORD:?required}@db:5432/${DB_NAME:?required}
      # Left unset by bootstrap-env.sh, and that is the intended state: the API
      # bounds its own pool at ten with a five-second wait. These exist so a
      # host that has grown past that can be told, without a rebuild -- the
      # role's own CONNECTION LIMIT stays the backstop either way.
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-}
      DATABASE_POOL_IDLE_TIMEOUT_MS: ${DATABASE_POOL_IDLE_TIMEOUT_MS:-}
      DATABASE_POOL_CONNECT_TIMEOUT_MS: ${DATABASE_POOL_CONNECT_TIMEOUT_MS:-}
      APP_BASE_URL: ${APP_BASE_URL:?required}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?required}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?required}
      LEGACY_DATA_ENCRYPTION_KEYS: ${LEGACY_DATA_ENCRYPTION_KEYS:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      # True because there is a reverse proxy in front that rewrites it. With
      # it false the rate limiter would count the proxy once for everybody.
      TRUST_PROXY_X_FORWARDED_FOR: ${TRUST_PROXY_X_FORWARDED_FOR:-true}
      SEO_INDEXING_ENABLED: ${SEO_INDEXING_ENABLED:-false}
      ADS_ENABLED: ${ADS_ENABLED:-false}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      DISCORD_REDIRECT_URI: ${DISCORD_REDIRECT_URI:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      # Every origin a sign-in may be completed on. Absent here, the backend
      # parsed an empty list and silently fell back to APP_BASE_URL for every
      # request, which no second domain could ever have overridden.
      OAUTH_ALLOWED_REDIRECT_URIS: ${OAUTH_ALLOWED_REDIRECT_URIS:-}
      PHOTO_STORAGE_DIR: /data/moneyverse/photos
      # A second connection, with one privilege: recording a status snapshot.
      # The application role is refused that write on purpose (013), so the
      # collector cannot borrow the pool every other query uses. Absent, the
      # collector does not run and /status keeps saying 확인 중.
      STATUS_COLLECTOR_DATABASE_URL: ${STATUS_COLLECTOR_PASSWORD:+postgresql://moneyverse_status_collector:${STATUS_COLLECTOR_PASSWORD}@db:5432/${DB_NAME}}
      # The schedule runs reconciliation as its own role, because 018 checks
      # the session login role: the application role cannot write a snapshot
      # even by accident, and borrowing its pool here would give that back.
      RECONCILER_DATABASE_URL: ${RECONCILER_PASSWORD:+postgresql://moneyverse_reconciler:${RECONCILER_PASSWORD}@db:5432/${DB_NAME}}
      STATUS_COLLECT_INTERVAL_MS: ${STATUS_COLLECT_INTERVAL_MS:-30000}
      # The market only moves where this says so. The tick takes an advisory
      # lock, so a second process would be harmless, but a deployment should
      # say out loud that it is the one running the market.
      MARKET_TICKER_ENABLED: ${MARKET_TICKER_ENABLED:-true}
      MARKET_TICK_INTERVAL_MS: ${MARKET_TICK_INTERVAL_MS:-1000}
      # The administrator's second factor. 32 bytes, as 64 hex characters or
      # base64, and it never reaches the database: the TOTP secret is sealed
      # with it before it is stored, so a database read alone yields nothing
      # that can produce a code. Absent, the console's second-factor routes
      # answer 503 and no administrator can enter — which is the intended
      # failure, because the alternative is a console with one factor.
      ADMIN_TOTP_ENCRYPTION_KEY: ${ADMIN_TOTP_ENCRYPTION_KEY:-}
      # Names which key sealed a stored secret, so the key can be rotated
      # without guessing which rows the new one can still open.
      ADMIN_TOTP_KEY_ID: ${ADMIN_TOTP_KEY_ID:-default}
      # Salts the hash that recognises a returning administrator device.
      # Falls back to INTERNAL_API_TOKEN, which every deployment already has.
      ADMIN_DEVICE_HASH_PEPPER: ${ADMIN_DEVICE_HASH_PEPPER:-}
      # The Discord bot. These were absent entirely, which is the other half
      # of why the bot did nothing in production: the code was switched off and
      # the deployment could not have configured it anyway.
      #
      # The application id and the bot token belong to ONE deployment. They
      # come from the GitHub environment the deploy was run against, so test
      # and production resolve different values through the same reference,
      # and the API refuses a token whose application id is not the one below
      # rather than posting this stack's events into the other stack's guild.
      DISCORD_APPLICATION_ID: ${DISCORD_APPLICATION_ID:-}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      # The public interaction webhook. Off unless this deployment says
      # otherwise, and disabled by the API on any malformed id.
      DISCORD_INTERACTIONS_ENABLED: ${DISCORD_INTERACTIONS_ENABLED:-false}
      DISCORD_INTERACTIONS_PUBLIC_KEY: ${DISCORD_INTERACTIONS_PUBLIC_KEY:-}
      DISCORD_INTERACTIONS_GUILD_ID: ${DISCORD_INTERACTIONS_GUILD_ID:-}
      DISCORD_INTERACTIONS_ROLE_IDS: ${DISCORD_INTERACTIONS_ROLE_IDS:-}
      DISCORD_INTERACTIONS_ROLE_MODE: ${DISCORD_INTERACTIONS_ROLE_MODE:-any}
      # The outbox worker: which channel the `default` route posts to, and how
      # often it looks. DISCORD_OUTBOX_CHANNEL_IDS adds further route keys as
      # `key=id,key=id` for the routes 066 leaves room for.
      DISCORD_OUTBOX_ENABLED: ${DISCORD_OUTBOX_ENABLED:-false}
      DISCORD_OUTBOX_CHANNEL_ID: ${DISCORD_OUTBOX_CHANNEL_ID:-}
      DISCORD_OUTBOX_CHANNEL_IDS: ${DISCORD_OUTBOX_CHANNEL_IDS:-}
      DISCORD_OUTBOX_INTERVAL_MS: ${DISCORD_OUTBOX_INTERVAL_MS:-5000}
    volumes:
      # A directory on the host rather than a docker volume, so the object
      # store can be put on a disk chosen for it. See bootstrap-env.sh.
      - ${PHOTO_STORAGE_HOST_DIR:?required}:/data/moneyverse/photos
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'node', '-e', "require('http').get('http://127.0.0.1:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  frontend:
    # Built with APP_BASE_URL baked in, because robots.txt and sitemap.xml are
    # generated during the build and have to name the public host. Changing
    # the origin therefore needs a rebuild, not just a restart.
    image: ${FRONTEND_IMAGE:-ghcr.io/wtrdd1-hash/wdmv/frontend:latest-test}
    container_name: ${STACK:-wdmv}-frontend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 512
    mem_limit: 1g
    memswap_limit: 2g
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m
      - /app/frontend/.next/cache:rw,nosuid,nodev,size=256m,mode=1777
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      # Internal only. The browser never uses this address.
      API_ORIGIN: http://backend:3000
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?required}
      APP_BASE_URL: ${APP_BASE_URL:?required}
      # `allowedOrigins` in src/lib/public-url.ts reads the same list the API
      # does, so that a visitor who arrived on a second registered host is sent
      # back to it rather than to the canonical one -- which would lose the
      # host-only session cookie mid-sign-in. Absent here, that function saw
      # only APP_BASE_URL and the second host could never work.
      OAUTH_ALLOWED_REDIRECT_URIS: ${OAUTH_ALLOWED_REDIRECT_URIS:-}
      SEO_INDEXING_ENABLED: ${SEO_INDEXING_ENABLED:-false}
      # Public identifiers; the unit remains absent unless all three values
      # below are set. The homepage is the code-side allowlist entry.
      ADS_ENABLED: ${ADS_ENABLED:-false}
      ADSENSE_PUBLISHER_ID: ${ADSENSE_PUBLISHER_ID:-}
      ADSENSE_HOME_SLOT: ${ADSENSE_HOME_SLOT:-}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '-e', "require('http').get('http://127.0.0.1:3000/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  edge:
    image: nginx:1.30.4-alpine
    container_name: ${STACK:-wdmv}-edge
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    read_only: true
    tmpfs:
      - /var/cache/nginx:rw,nosuid,nodev,size=64m
      - /var/run:rw,nosuid,nodev,size=16m
      - /tmp:rw,nosuid,nodev,size=16m
    volumes:
      # The directory, not the file. A bind mount of a single file binds its
      # inode, and shipping a new config replaces the file rather than editing
      # it — after which the container goes on serving the old, unlinked one
      # with no error anywhere. Binding the directory makes a replacement
      # visible, so `nginx -s reload` is enough.
      - ./edge:/etc/nginx/conf.d:ro
    depends_on:
      frontend:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O - http://127.0.0.1/nginx-health | grep -qx ok']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    # Published on loopback as well, so an operator on the host can check the
    # site without going out through Cloudflare and back.
    ports:
      - '127.0.0.1:${EDGE_PORT:-3021}:80'
    networks:
      default:
      tunnel:
        aliases: ["${STACK:-wdmv}"]

volumes:
  db-data:

networks:
  # The Cloudflare tunnel's own network. Joining it is what lets the tunnel
  # resolve `wdmv` — nothing here is published to the internet directly.
  tunnel:
    external: true
    name: wtrdd-edge
