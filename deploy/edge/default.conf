# The stack's single entrance.
#
# Two upstreams, split by path. `/socket.io/` is the lobby and belongs to the
# API; everything else is the Next.js application. They share one origin on
# purpose: the session is a same-origin HttpOnly cookie and the lobby's
# handshake carries it, so putting the socket on a second hostname would mean
# either a cross-origin cookie or a second session.
#
# Nothing else about the API is exposed. `/api/` is not routed here — the
# browser talks to Next, and Next talks to the API over the internal network.
# The one exception is the Discord interaction webhook below: Discord POSTs to
# it from the outside, so it has to be routed, and it is one exact path rather
# than a prefix.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Cloudflare gives the visitor's address in CF-Connecting-IP. Preferring it
# over whatever X-Forwarded-For arrives is what makes the API's rate limiter
# count the visitor rather than counting this proxy once for everybody.
map $http_cf_connecting_ip $client_ip {
    default $http_cf_connecting_ip;
    ''      $remote_addr;
}

server {
    listen 80;
    server_name _;

    # Bounded: the only large upload is an operator's photo, and the API caps
    # that at 8 MB itself.
    client_max_body_size 9m;

    # nginx's default response-header buffer is 4 KB, and a Next.js dynamic
    # page overruns it: the framework emits a Link header preloading every
    # chunk and font the route needs, which for these pages is well past that.
    # The symptom is "upstream sent too big header" and a 502 on exactly the
    # dynamic routes, while every prerendered one is fine.
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;
    proxy_busy_buffers_size 32k;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Discord's interaction webhook, and only that URI.
    #
    # An exact-match location so no other API path becomes reachable by
    # sharing a prefix with it. The handler verifies an Ed25519 signature over
    # the exact request bytes before it parses anything, which is what makes a
    # publicly reachable endpoint acceptable at all — so nothing here may
    # rewrite the body, and the two signature headers must arrive untouched.
    location = /api/v1/integrations/discord/interactions {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $client_ip;
        proxy_set_header X-Forwarded-Proto https;
        # An interaction is a few hundred bytes; the API caps it at 32 KB
        # itself and answers 413 above that.
        client_max_body_size 64k;
        proxy_request_buffering on;
        # Discord gives an interaction three seconds before it gives up.
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
    }

    location /socket.io/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        # The lobby's origin check compares this to APP_BASE_URL, so it has to
        # arrive unchanged.
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $client_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $client_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
