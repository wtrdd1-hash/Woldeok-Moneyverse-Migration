# Proposed REPLACEMENT for /etc/logrotate.d/nginx ONLY AFTER isolated Test.
# Do not install alongside an overlapping nginx logrotate wildcard.
# Important Nginx access 5xx/429 separately archived for 30 days.
/var/log/nginx/access.log {
    daily
    rotate 7
    missingok
    notifempty
    compress
    delaycompress
    create 0640 www-data adm
    sharedscripts
    postrotate
        invoke-rc.d nginx rotate >/dev/null 2>&1
    endscript
}
/var/log/nginx/error.log {
    daily
    rotate 30
    missingok
    notifempty
    compress
    delaycompress
    create 0640 www-data adm
    sharedscripts
    postrotate
        invoke-rc.d nginx rotate >/dev/null 2>&1
    endscript
}
