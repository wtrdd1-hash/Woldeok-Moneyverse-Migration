# CANDIDATE — not applied (owner decision: changes inference behaviour).
# Models on disk: 1.93 GB, 1.84 GB, 0.78 GB. With OLLAMA_MAX_LOADED_MODELS=2 the service peaked
# at 4.9–5.3 GiB plus 2.8–3.0 GiB swap on a 7.9 GiB host shared with Production. One loaded
# model (largest 1.93 GB + context) fits 3 GiB; switching models then costs a reload (seconds).
[Service]
Environment=OLLAMA_MAX_LOADED_MODELS=1
MemoryHigh=2560M
MemoryMax=3G
