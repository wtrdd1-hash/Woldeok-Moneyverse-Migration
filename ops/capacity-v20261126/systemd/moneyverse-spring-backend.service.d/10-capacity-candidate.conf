# CANDIDATE — not applied. Production apply needs separate owner approval and the
# zero-downtime release gate (restart of the production API).
# Measured 2026-11-26 (isolated synthetic sandbox, same jar line): live heap after GC 87–92 MB
# at 100 concurrent readers; production today uses 144 MB of a 2.0 GiB default max heap with no
# cgroup limit (RSS 330 MB + swap 557 MB). G1 is explicit because a cgroup below ~1.8 GiB makes
# the JVM pick SerialGC (sandbox: 4 full GCs, 97.5 ms max pause vs 0 and 12.7 ms with G1).
[Service]
Environment="JAVA_TOOL_OPTIONS=-XX:+UseG1GC -XX:MaxGCPauseMillis=100 -Xms256m -Xmx512m -XX:MaxMetaspaceSize=256m -XX:MaxDirectMemorySize=128m -XX:+ExitOnOutOfMemoryError"
MemoryHigh=1024M
MemoryMax=1280M
# Restart=always already restarts after ExitOnOutOfMemoryError; keep the existing unit value.
