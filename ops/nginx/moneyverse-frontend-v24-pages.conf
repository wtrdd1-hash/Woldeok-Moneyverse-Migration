# v2026.11.18.24 Spring-only static public-frontend rollout (13 source-proven routes).
# User-specific, search, news/blog posts and financial actions retain their existing upstreams.
location = / {
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    proxy_pass http://127.0.0.1:4638;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
    proxy_hide_header X-Frame-Options;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-MV-Frontend-Release "v2026.11.18.24" always;
    add_header Cache-Control "private, no-store" always;
}
