# v2026.11.17.4 — internal gateway only (listen 127.0.0.1:4400).
# The canonical Nest OAuth challenge/PKCE callbacks have not moved to Spring.
# Include this in the internal API gateway server block, before its generic
# Spring fallthrough. Do not include in the public frontend server block.
# Scope is deliberately narrow: do not reroute prelogin/local auth or banking.
location ~ ^/auth/(discord|google)/(authorize|callback)$ {
    proxy_pass http://prod_node;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 5s;
    proxy_read_timeout 20s;
    add_header Cache-Control "private, no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    # OAuth callback query includes a one-time code: never write it to access logs.
    access_log off;
}
