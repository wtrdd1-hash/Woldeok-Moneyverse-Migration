# Include inside the public server block only. Candidate first, legacy fallback.
# `frontend/_next/static` is an immutable symlink to candidate .next/static.
# Existing older builds and legacy blog fallbacks continue via prod_frontend.
location ^~ /_next/static/ {
    root /srv/moneyverse-data/releases/seo-v2026.11.17.3-20daef3f6f/frontend;
    try_files $uri @mv_seo_v3_legacy_static;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Moneyverse-Static-Source "seo-v3" always;
}

location @mv_seo_v3_legacy_static {
    proxy_pass http://prod_frontend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_intercept_errors on;
    error_page 404 = @mv_blog_v1417_static;
}
