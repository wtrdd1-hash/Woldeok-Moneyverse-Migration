# v2026.11.17.2 — SEO source-of-truth compatibility bridge.
# Include inside the localhost:4400 unified API gateway server block.
# Retained NestJS :4500 owns actual crawler observations, GSC integration,
# IndexNow submission and administrator session/role checks during Spring migration.
# Nginx ^~ locations deliberately outrank the broader Spring regex.
# No cookies, x-internal-token, or client-origin auth headers are manufactured here.

location ^~ /api/v1/seo/ {
    proxy_pass http://prod_node;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    add_header Cache-Control "private, no-store" always;
}

# Legacy internal SEO aliases must not silently fall back to Spring sample data.
location ^~ /api/seo/ {
    rewrite ^/api/seo/(.*)$ /api/v1/seo/$1 break;
    proxy_pass http://prod_node;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    add_header Cache-Control "private, no-store" always;
}

location ^~ /seo/ {
    rewrite ^/seo/(.*)$ /api/v1/seo/$1 break;
    proxy_pass http://prod_node;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    add_header Cache-Control "private, no-store" always;
}

# The canonical key is rendered by Next, NOT by Spring's mismatched hardcoded key.
location = /.well-known/indexnow.key {
    proxy_pass http://prod_frontend;
    proxy_set_header Host easy-scraping.com;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 5s;
    proxy_read_timeout 10s;
}
