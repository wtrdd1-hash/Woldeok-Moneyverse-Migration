# v2026.11.17.1 — Public-edge defense in depth for Admin console authority.
# Include ONCE inside listen 80 default_server for easy-scraping.com.
# Browser requests have NO private transport token; Nest's internal-token +
# real-user/role/console guards must deny them (or BFF use internal gateway).
# Prevent Next.js /api/v1 rewrite from reaching token-only Spring admin facade.
# Never create or forward fabricated identity credentials.

location = /api/v1/admin/security {
    proxy_pass http://prod_node;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    add_header Cache-Control "private, no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
}
location ^~ /api/v1/admin/security/ {
    proxy_pass http://prod_node;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    add_header Cache-Control "private, no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
}
location = /api/v1/admin/me {
    proxy_pass http://prod_node;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    add_header Cache-Control "private, no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
}
