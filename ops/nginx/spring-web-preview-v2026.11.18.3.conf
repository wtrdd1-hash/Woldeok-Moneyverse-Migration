# v2026.11.18.3 — Only Spring-rendered read-only previews, never canonical Next/API.
# Include inside a Test or public server {} after setting:
#   set $mv_spring_preview_upstream "127.0.0.1:4576";  # isolated Test
#   set $mv_spring_preview_upstream "127.0.0.1:4577";  # isolated Production
# No account cookie, bearer token or API actor headers reach the preview H2 runtime.
location = /spring-web {
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    proxy_pass http://$mv_spring_preview_upstream;
    proxy_set_header Host $host;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_set_header X-Internal-Token "";
    proxy_set_header X-User-Id "";
    proxy_set_header X-Actor-User-Id "";
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 2s;
    proxy_read_timeout 10s;
    proxy_hide_header Cache-Control;
    proxy_hide_header X-Robots-Tag;
    add_header Cache-Control "private, no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Moneyverse-Spring-Preview "v2026.11.18.3" always;
}
