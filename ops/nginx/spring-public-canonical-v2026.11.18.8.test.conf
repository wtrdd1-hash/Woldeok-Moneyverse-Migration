# v2026.11.18.8 — unified Spring MVC/Thymeleaf public canonical routes.
# Exact static public pages only; NEVER /api, OAuth, admin, wallet or any financial writes.
# Browser cookies/Authorization are not forwarded to the H2-only frontend runtime.
location = / {
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    proxy_pass http://127.0.0.1:4582;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_set_header X-Internal-Token "";
    proxy_set_header X-User-Id "";
    proxy_set_header X-Actor-User-Id "";
    proxy_hide_header Set-Cookie;
    proxy_connect_timeout 2s;
    proxy_read_timeout 15s;
    add_header X-Moneyverse-Spring-Canonical "v2026.11.18.8-test" always;
}
