# v2026.11.18.6 isolated canonical Spring Test homepage + guide.
# Never direct authentication/API/finance paths to this H2-only instance.
location = / {
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    proxy_pass http://127.0.0.1:4578;
    proxy_set_header Host $host;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_set_header X-Internal-Token "";
    proxy_set_header X-User-Id "";
    proxy_set_header X-Actor-User-Id "";
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
    add_header Cache-Control "private, no-store" always;
    add_header X-Moneyverse-Spring-Canonical "v2026.11.18.6-test" always;
}
location = /guide {
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    proxy_pass http://127.0.0.1:4578;
    proxy_set_header Host $host;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_set_header X-Internal-Token "";
    proxy_set_header X-User-Id "";
    proxy_set_header X-Actor-User-Id "";
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
    add_header Cache-Control "private, no-store" always;
    add_header X-Moneyverse-Spring-Canonical "v2026.11.18.6-test" always;
}
location = /spring-ui/guide.css {
    proxy_pass http://127.0.0.1:4578;
    proxy_set_header Cookie "";
    add_header Cache-Control "public, max-age=120" always;
}
location = /spring-ui/home.css {
    proxy_pass http://127.0.0.1:4578;
    proxy_set_header Cookie "";
    add_header Cache-Control "public, max-age=120" always;
}
