# v2026.11.19.39 — Emergency temporary public financial-privacy gates.
# Template for inclusion ONCE within EACH externally reachable Nginx server {}.
# These paths lack verified owner-scoped backend ledger/privacy. Remove this
# temporary block ONLY once backend auth/ledger/session, CI and E2E are certified.
# This fragment does not use user-supplied identity headers as authentication.
location = /api/wallet/overview {
    default_type application/json;
    add_header Cache-Control "private, no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    return 401 '{"ok":false,"code":"AUTH_REQUIRED"}';
}
