# v2026.11.17.2 — production edge safety net for immutable old Next release.
# Include inside the public listen 80 default_server (not the localhost gateway).
# The existing Next /api/admin/seo/status BFF now consults NestJS session/role
# through the source-of-truth gateway. No edge-supplied bypass token is used.
location = /__mv_seo_authorize_20261117 {
    internal;
    proxy_pass http://prod_frontend/api/admin/seo/status;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host easy-scraping.com;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host easy-scraping.com;
    proxy_set_header Cookie $http_cookie;
    proxy_connect_timeout 5s;
    proxy_read_timeout 25s;
}

location = /api/admin/seo-audit {
    auth_request /__mv_seo_authorize_20261117;
    # Nginx reports 5xx auth subrequests as 500; preserve truthful unavailable.
    error_page 500 = @mv_seo_auth_unavailable;
    proxy_pass http://seo_release_frontend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    add_header Cache-Control "private, no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Moneyverse-SEO-Frontend "v2026.11.17.3" always;
}

location = /admin/seo {
    auth_request /__mv_seo_authorize_20261117;
    # Nginx reports 5xx auth subrequests as 500; preserve truthful unavailable.
    error_page 500 = @mv_seo_auth_unavailable;
    proxy_pass http://seo_release_frontend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    add_header Cache-Control "private, no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Moneyverse-SEO-Frontend "v2026.11.17.3" always;
}

location = /admin/seo-audit {
    auth_request /__mv_seo_authorize_20261117;
    # Nginx reports 5xx auth subrequests as 500; preserve truthful unavailable.
    error_page 500 = @mv_seo_auth_unavailable;
    proxy_pass http://seo_release_frontend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    add_header Cache-Control "private, no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Moneyverse-SEO-Frontend "v2026.11.17.3" always;
}

# Block unfinished/stale Next SEO direct-submission paths at the public edge.
# This is needed even before the independently built Next source is promoted:
# the current immutable frontend used to trust an internal service token alone.
location ^~ /api/admin/seo/ {
    auth_request /__mv_seo_authorize_20261117;
    error_page 500 = @mv_seo_auth_unavailable;
    proxy_pass http://seo_release_frontend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    add_header Cache-Control "private, no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Moneyverse-SEO-Frontend "v2026.11.17.3" always;
}

location = /api/indexnow {
    auth_request /__mv_seo_authorize_20261117;
    error_page 500 = @mv_seo_auth_unavailable;
    proxy_pass http://seo_release_frontend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    add_header Cache-Control "private, no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Moneyverse-SEO-Frontend "v2026.11.17.3" always;
}

# Preserve unavailable state without treating a failed identity check as allowed.
location @mv_seo_auth_unavailable {
    add_header Cache-Control "private, no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Moneyverse-SEO-Frontend "v2026.11.17.3" always;
    return 503;
}
