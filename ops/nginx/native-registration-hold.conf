# Stop the unaudited prototype signup path until canonical consent and funded registration exist.
location = /api/v1/auth/local/register {
    default_type application/json;
    add_header Cache-Control "private, no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    return 503 '{"ok":false,"success":false,"code":"LOCAL_REGISTRATION_CONTRACT_UNAVAILABLE"}';
}
