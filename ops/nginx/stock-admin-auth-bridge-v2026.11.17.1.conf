# v2026.11.17.1 — authoritative admin identity/console bridge.
# Include ONCE inside the localhost-only 127.0.0.1:4400 gateway server.
# The split Spring runtime currently returns an asserted consoleSession=open
# when it receives the server transport token; that is not a user login.
# Nest remains the authority for real DB-backed user, role, admin-console,
# CSRF and recent-identity checks during route-by-route Spring migration.
# These ^~ / exact locations outrank the broad Spring regex route.
# Neither sessions nor authorization are created at this proxy layer.

location = /api/v1/admin/security {
    proxy_pass http://prod_node;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    add_header Cache-Control "private, no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
}
location ^~ /api/v1/admin/security/ {
    proxy_pass http://prod_node;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    add_header Cache-Control "private, no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
}
location = /api/v1/admin/me {
    proxy_pass http://prod_node;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    add_header Cache-Control "private, no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
}
