# Isolated Test origin ONLY: never advertise test data or Production URLs.
# Distinct from Production robots/sitemap and authentication routing.
location = /robots.txt {
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    default_type text/plain;
    add_header Cache-Control "private, no-store" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options "nosniff" always;
    return 200 "User-agent: *\nDisallow: /\n";
}

# Empty sitemap is intentional: Test must not publish Production links or identities.
location = /sitemap.xml {
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    default_type application/xml;
    add_header Cache-Control "private, no-store" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options "nosniff" always;
    return 200 '<?xml version="1.0" encoding="UTF-8"?><urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9"></urlset>';
}
