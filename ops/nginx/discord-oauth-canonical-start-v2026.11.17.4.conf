# v2026.11.17.4: public edge only.
# Canonicalize only the OAuth START, before creating host-only __Host- session cookies.
# Callbacks and all other routes remain unchanged; do not redirect valid callbacks.
location ~ ^/auth/(discord|google)/authorize$ {
    if ($host = www.easy-scraping.com) {
        return 307 https://easy-scraping.com$request_uri;
    }
    proxy_pass http://prod_frontend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    proxy_set_header CF-IPCountry $http_cf_ipcountry;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    add_header Cache-Control "private, no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    access_log off;
}
