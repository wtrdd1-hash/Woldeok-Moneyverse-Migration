# Target: /etc/nginx/snippets/moneyverse-seo-v3-static-override.conf
# Replace only the existing location @mv_seo_v3_legacy_static block with these TWO blocks.
# Preserve old SEO files as primary, then this build's static assets, then legacy proxy.
location @mv_seo_v3_legacy_static {
    root /srv/moneyverse-data/frontend-static;
    try_files $uri @mv_seo_v3_legacy_proxy;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}
location @mv_seo_v3_legacy_proxy {
    proxy_pass http://prod_frontend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_intercept_errors on;
    error_page 404 = @mv_blog_v1417_static;
}
