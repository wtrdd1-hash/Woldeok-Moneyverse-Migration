# Moneyverse production Next frontend (G2) cutover, v20261124.
# Owner-approved promotion after security + functional tests (PR #3430).
# Pages and the Next BFF go to moneyverse-next-frontend-v20261124 (55476);
# every other /api path, realtime and integrations keep the Spring upstreams
# the legacy default server used. Rollback: remove this file, nginx -s reload.
# Legacy production kept these member/admin domains read-only at nginx
# (GET/HEAD only; v2026.11.18.22 member-readonly). Preserve that policy for the
# browser API, the Next gateway and the matching server-action pages.
map "$request_method:$uri" $mv_next_readonly_write {
    default 0;
    "~^(GET|HEAD|OPTIONS):" 0;
    "~^[A-Z]+:/api/(v1/)?(admin/(economy|stocks|users)|chat|notifications|profile|support|work)(/|$)" 1;
    "~^[A-Z]+:/app-api/v1/(admin/(economy|stocks|users)|chat|notifications|profile|support|work)(/|$)" 1;
    "~^[A-Z]+:/(support|chat|profile|account/notifications|notifications|work|admin/(users|economy|stocks|controls|market|enterprises))(/|$)" 1;
}

server {
    listen 80;
    listen [::]:80;
    server_name easy-scraping.com www.easy-scraping.com;
    client_max_body_size 12m;
    include /etc/nginx/snippets/moneyverse-pentagi-scanner-shield.conf;
    if ($mv_next_readonly_write) {
        return 403;
    }

    location ^~ /actuator { deny all; }

    # Health checks keep the legacy Spring targets (they answered 200 before the cutover).
    location = /health {
        proxy_pass http://127.0.0.1:4550/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
    location = /health/spring {
        proxy_pass http://127.0.0.1:4550/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
    location ^~ /api/v1/spring/ {
        rewrite ^/api/v1/spring/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:4550;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /socket.io/ {
        proxy_pass http://127.0.0.1:9092;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header CF-IPCountry $http_cf_ipcountry;
        proxy_connect_timeout 300s;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location /api/v1/integrations/discord/ {
        proxy_pass http://127.0.0.1:9092;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header CF-IPCountry $http_cf_ipcountry;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 300s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Read-only verified blog API (moneyverse-blog-reader-v20261124); legacy 9092 answered 400.
    location ^~ /api/v1/blog/verified {
        proxy_pass http://127.0.0.1:55470;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header CF-IPCountry $http_cf_ipcountry;
        proxy_set_header X-Forwarded-Proto https;
    }
    location ^~ /api/v1/admin/blog-verified {
        proxy_pass http://127.0.0.1:9092;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header CF-IPCountry $http_cf_ipcountry;
        proxy_set_header X-Forwarded-Proto https;
        proxy_hide_header X-Robots-Tag;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location = /api/blog/generate {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 503 '{"success":false,"code":"LEGACY_UNVERIFIED_PUBLISHER_RETIRED"}';
    }

    # Next BFF route handlers (frontend/src/app/api/**/route.ts, 106 routes).
    location ~ ^/api/(?:activity/events|admin/api-health/backup-inventory|admin/api-health/status|admin/auth/channel-otp/elevate|admin/auth/channel-otp/request|admin/auth/channel-otp/revoke|admin/auth/channel-otp/status|admin/auth/channel-otp/test-ping|admin/auth/channel-otp/verify|admin/blog/publisher-status|admin/blog/[^/]+|admin/bonds/distribute-coupons|admin/bonds/issues|admin/bonds/overview|admin/central-bank/policy|admin/central-bank/status|admin/discord/test-dm|admin/economy/tax-policy|admin/economy/tax-policy/auto-adjust|admin/enterprises/harvest|admin/enterprises/status|admin/kdic/ledger-integrity|admin/kdic/overview|admin/mint/certificates|admin/mint/execute-mint|admin/mint/execute-retire|admin/mint/freeze|admin/mint/orders|admin/mint/orders/[^/]+/approve|admin/mint/status|admin/mint/treasury-issue|admin/operations/storage|admin/pension/distribute|admin/pension/overview|admin/pension/recent-payouts|admin/seo-audit|admin/seo/gsc-sitemap-submit|admin/seo/indexing-submit|admin/seo/status|admin/seo/twitter|admin/treasury/grants|admin/treasury/grants/clawback|admin/treasury/mint-topup|admin/treasury/salary/disburse|admin/treasury/swf|admin/treasury/swf/liquidate|admin/treasury/swf/rebalance|advisor/deoki/ask|advisor/deoki/diagnose|advisor/deoki/rebalance/execute|arena/rooms|arena/rooms/[^/]+/cancel|arena/rooms/[^/]+/join|attendance/spin|attendance/status|auth/clear-session|blog|blog/generate|blog/[^/]+|bonds/repo-loans/borrow|bonds/repo-loans/repay|bonds/rollover|bonds/subscribe|content/announcements|discord/broadcast|events/burn-draw|indexnow|market/secret-auction|market/secret-auction/[^/]+/bid|notifications|notifications/claim-all|notifications/search|notifications/unread-count|pension/contribute|pension/funded/contribute|pension/funded/position|pension/funded/withdraw|pension/liquidate|pension/toggle-retire|seo/crawl-audit|seo/gsc|seo/gsc/digest-report|seo/metadata|seo/status|seo/submit|shop/purchases|shop/purchases/export|spaces/real-estate/auction|spaces/real-estate/claim-rent|stocks|stocks/[^/]+/candles|stocks/league|stocks/league/copy-trade/cancel|stocks/league/copy-trade/subscribe|stocks/league/join|transfers/p2p|transfers/search|treasury/apply-grant|treasury/claim|treasury/donate|treasury/overview|treasury/proposals|v1/seo/indexnow|v1/telemetry/client-error|viewer|wallet/summary)$ {
        proxy_pass http://127.0.0.1:55476;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header CF-IPCountry $http_cf_ipcountry;
        proxy_read_timeout 60s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:4550;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header CF-IPCountry $http_cf_ipcountry;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location / {
        proxy_pass http://127.0.0.1:55476;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header CF-IPCountry $http_cf_ipcountry;
        proxy_read_timeout 60s;
        proxy_redirect http://127.0.0.1:55476/ /;
        add_header X-Moneyverse-Frontend "next-g2-v20261124" always;
    }
}
