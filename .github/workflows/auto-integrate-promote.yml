name: Auto Integrate and Promote

on:
  schedule:
    - cron: '5,20,35,50 * * * *'
  workflow_dispatch:
  workflow_run:
    workflows: [Build Test Candidate]
    types: [completed]

# P0 #1663: 352 unmerged PR heads were closed/deleted. Until independent
# exact-SHA Test/auth/finance/DB/security attestations can be verified,
# this workflow is an inventory-only release HOLD. A candidate build is NOT
# an authorization to mutate a PR, branch, or production environment.
permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: auto-integrate-promote
  cancel-in-progress: false

jobs:
  integrate-validated-branches:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch != 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Inventory ready PRs without changing any branch or PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          snapshot="$(mktemp)"
          candidates="$(mktemp)"
          trap 'rm -f "$snapshot" "$candidates"' EXIT
          if ! gh api --paginate "repos/${REPO}/pulls?state=open&base=main&per_page=100" > "$snapshot"; then
            echo '::error::BLOCKED: failed to enumerate all open PRs (possible GitHub API rate limit); no branch processing or promotion'
            exit 1
          fi
          if ! jq -r -f scripts/release/select-integration-prs.jq "$snapshot" | sort -u > "$candidates"; then
            echo '::error::BLOCKED: open PR snapshot is invalid; no branch processing or promotion'
            exit 1
          fi
          mapfile -t branches < "$candidates"
          open_pr_count="$(jq -s '[.[][]] | length' "$snapshot")"
          echo "open PRs=${open_pr_count}, ready candidates=${#branches[@]}"
          for branch in "${branches[@]}"; do
            # Snapshot is only evidence of a candidate, never authorization.
            # Do not auto-rebase, close, delete, merge, or dispatch a release.
            echo "::warning::BLOCKED: independent isolated-Test and finance/auth/DB/security attestation unavailable for ${branch}; no merge, cleanup or promotion"
          done
          {
            echo '## Read-only integration inventory — release HOLD'
            echo "- open PRs in snapshot: ${open_pr_count}"
            echo "- ready candidates: ${#branches[@]}"
            echo '- mutations: 0 (no branch push, PR close/merge, delete, or Production dispatch)'
            echo '- P0 #1663: preserve 352 unmerged recovered PR heads and review queue.'
            echo '- P0 #1088: independent exact-SHA Test/auth/finance/DB/security approval is required before enabling integration.'
          } >> "$GITHUB_STEP_SUMMARY"

      # P0 #2031 / QA v1410: independently compare public Production source
      # with GitHub main; do not add a scheduler or grant write permissions.
      - name: Block on unmerged public Production source (read-only)
        if: github.event_name != 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq '.commit.sha')"
          [[ "$main_sha" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::Canonical main SHA unavailable'; exit 1; }
          node scripts/release/verify-production-public-main.mjs --main-sha "$main_sha"
