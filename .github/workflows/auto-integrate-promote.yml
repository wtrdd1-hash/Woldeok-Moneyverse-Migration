# P0 containment for #1088: a built candidate is NOT an isolated-Test attestation.
# Until independently verified exact-SHA Test, finance, PostgreSQL, security and
# backup/restore evidence is available, integration and promotion are manual only.
# Retain the existing schedule and trigger to make the audit visible, not to merge.
name: Auto Integrate and Promote

on:
  schedule:
    - cron: '5,20,35,50 * * * *'
  workflow_dispatch:
  workflow_run:
    workflows: [Build Test Candidate]
    types: [completed]

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: auto-integrate-promote
  cancel-in-progress: false

jobs:
  audit-only:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch != 'main')
    runs-on: ubuntu-latest
    steps:
      - name: Audit candidate heads without modifying refs or dispatching releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/${REPO}/branches/main" --jq '.commit.sha')"
          pr_lines="$(gh api --paginate "repos/${REPO}/pulls?state=open&base=main&per_page=100" --jq '.[] | [.number,.head.ref,.head.sha,(.draft|tostring)] | @tsv')"
          {
            echo '## Integration gate: audit only (P0 #1088)'
            echo
            echo "- current main: \`${main_sha}\`"
            echo '- Build Test Candidate SUCCESS only means an image was built.'
            echo '- A pending isolated-Test deployment is NOT Test acceptance.'
            echo '- Exact-SHA authenticated finance E2E, real PostgreSQL ACL, security, restore and independent signed Test attestation remain required.'
            echo '- This workflow cannot merge, reconcile, delete branches, dispatch Production, or promote.'
            echo
            if [[ -z "$pr_lines" ]]; then
              echo '- No open PRs targeting main.'
            else
              while IFS=$'\t' read -r number branch sha draft; do
                encoded="$(jq -rn --arg v "$branch" '$v|@uri')"
                candidate="$(gh api "repos/${REPO}/actions/workflows/test-candidate.yml/runs?branch=${encoded}&per_page=30" \
                  | jq -r --arg sha "$sha" '[.workflow_runs[] | select(.head_sha == $sha)] | first | if . == null then "none" else ((.conclusion // .status // "unknown") | tostring) end')"
                echo "- PR #${number}: head \`${sha}\`, draft=${draft}, candidate=${candidate}; merge authorization=BLOCKED"
              done <<< "$pr_lines"
            fi
          } >> "$GITHUB_STEP_SUMMARY"