name: Auto Integrate and Promote

on:
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:
  workflow_run:
    workflows: [Build Test Candidate]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: auto-integrate-promote
  cancel-in-progress: false

jobs:
  integrate-validated-branches:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch != 'main')
    runs-on: ubuntu-latest
    steps:
      - name: Drain validated development branches
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          main_sha="$(gh api "repos/${REPO}/branches/main" --jq '.commit.sha')"
          echo "current main: ${main_sha}"

          mapfile -t branches < <(
            gh api --paginate "repos/${REPO}/branches?per_page=100" --jq '.[].name' | sort
          )

          merged_count=0
          validated_count=0
          conflict_count=0

          for branch in "${branches[@]}"; do
            case "$branch" in
              main|production|staging|develop|release/*) continue ;;
              feat/*|feature/*|fix/*|bugfix/*|integrate/*|ops/*|auto/*|test-candidate/*|security/*) ;;
              *) continue ;;
            esac

            encoded="$(jq -rn --arg v "$branch" '$v|@uri')"
            branch_sha="$(gh api "repos/${REPO}/branches/${encoded}" --jq '.commit.sha')"
            compare="$(gh api "repos/${REPO}/compare/main...${encoded}" 2>/dev/null || true)"
            [[ -n "$compare" ]] || continue
            ahead="$(jq -r '.ahead_by // 0' <<<"$compare")"
            [[ "$ahead" -gt 0 ]] || continue

            validated="$(
              gh api --method GET "repos/${REPO}/actions/workflows/test-candidate.yml/runs" \
                -f branch="$branch" -f status=success -f per_page=50 \
                --jq ".workflow_runs[] | select(.head_sha == \"${branch_sha}\") | .id" \
                | head -n 1
            )"
            if [[ -z "$validated" ]]; then
              echo "skip ${branch}: exact head ${branch_sha} has no successful Build Test Candidate run"
              continue
            fi
            validated_count=$((validated_count + 1))

            pr="$(
              gh api --method GET "repos/${REPO}/pulls" \
                -f state=open -f base=main -f head="${GITHUB_REPOSITORY_OWNER}:${branch}" -f per_page=10 \
                --jq '.[0].number // empty'
            )"

            if [[ -z "$pr" ]]; then
              title="auto: integrate ${branch}"
              printf -v body '%s\n' \
                'Automated integration candidate.' \
                '' \
                'Gate:' \
                "- exact branch SHA: ${branch_sha}" \
                "- successful Build Test Candidate run: ${validated}" \
                '- target: main' \
                '' \
                'This workflow drains every currently validated, mergeable branch in one serialized run. After the drain it dispatches one main Test Candidate for the final main SHA; Production remains gated by isolated Test exact-SHA/backend checks and the existing GitOps production-ready flow.'
              pr="$(gh api --method POST "repos/${REPO}/pulls" \
                -f title="$title" -f head="$branch" -f base=main -f body="$body" \
                --jq '.number')"
              echo "opened PR #${pr} for ${branch}"
            fi

            mergeable="unknown"
            merge_state="unknown"
            for _ in $(seq 1 12); do
              pr_json="$(gh api "repos/${REPO}/pulls/${pr}")"
              mergeable="$(jq -r 'if .mergeable == null then "unknown" else (.mergeable|tostring) end' <<<"$pr_json")"
              merge_state="$(jq -r '.mergeable_state // "unknown"' <<<"$pr_json")"
              [[ "$mergeable" != "unknown" ]] && break
              sleep 5
            done

            if [[ "$mergeable" != "true" || ! "$merge_state" =~ ^(clean|unstable|has_hooks)$ ]]; then
              if [[ "$merge_state" == "dirty" ]]; then
                conflict_count=$((conflict_count + 1))
                echo "::warning::PR #${pr} (${branch}) has merge conflicts and was left open for repair"
              else
                echo "skip PR #${pr}: mergeable=${mergeable}, state=${merge_state}"
              fi
              continue
            fi

            current_head="$(gh api "repos/${REPO}/pulls/${pr}" --jq '.head.sha')"
            if [[ "$current_head" != "$branch_sha" ]]; then
              echo "skip PR #${pr}: head moved from ${branch_sha} to ${current_head}"
              continue
            fi

            gh pr merge "$pr" --repo "$REPO" --squash --delete-branch --match-head-commit "$branch_sha"
            merged_count=$((merged_count + 1))
            echo "merged PR #${pr}; source branch cleanup requested"
          done

          if [[ "$merged_count" -gt 0 ]]; then
            final_main_sha="$(gh api "repos/${REPO}/branches/main" --jq '.commit.sha')"
            gh workflow run test-candidate.yml --repo "$REPO" --ref main
            echo "dispatched main Build Test Candidate for final main ${final_main_sha}"
          fi

          {
            echo '## Auto integration drain summary'
            echo
            echo "- validated branches observed: ${validated_count}"
            echo "- merged branches: ${merged_count}"
            echo "- merge-conflicted branches left open: ${conflict_count}"
            if [[ "$merged_count" -eq 0 ]]; then
              echo '- no final main candidate dispatch was needed'
            else
              echo '- one final main Build Test Candidate was dispatched after the drain'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
