name: Auto Integrate and Promote

on:
  schedule:
    - cron: '5,20,35,50 * * * *'
  workflow_dispatch:
  workflow_run:
    workflows: [Build Test Candidate]
    types: [completed]

# P0 #1088: a candidate build only creates a pending Test deployment. It is not
# independent proof of exact-SHA deployed Test, migration parity, authenticated
# backend/API/DB and finance E2E, backup/restore, or required security gates.
# Keep the observer scheduled, but deny write privileges and any automatic
# merge, branch reconciliation/deletion, or Production dispatch until a separately
# reviewed, independently verifiable release attestation gate exists.
permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: auto-integrate-promote
  cancel-in-progress: false

jobs:
  audit-release-eligibility:
    runs-on: ubuntu-latest
    steps:
      - name: Report fail-closed release eligibility without mutating worker branches
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          echo '::warning::BLOCKED: successful candidate CI is not independently verified isolated Test deployment or authenticated finance E2E.'
          echo 'No PR will be merged, reconciled, deleted or dispatched by this workflow.'
          gh api --paginate "repos/${REPO}/pulls?state=open&base=main&per_page=100" \
            --jq '.[] | select(.head.repo.full_name == .base.repo.full_name) | [.number, .head.ref, .head.sha, .draft] | @tsv' \
            | while IFS=$'\t' read -r number branch sha draft; do
                echo "PR #${number} branch=${branch} head=${sha} draft=${draft}: BLOCKED pending independently verified exact-SHA Test, migration/security, authenticated backend/API/DB and finance E2E evidence."
              done
          {
            echo '## Automatic integration release HOLD (P0 #1088)'
            echo
            echo '- Decision: **BLOCKED**; read-only observation only.'
            echo '- A successful Build Test Candidate workflow is not a deployed isolated-Test attestation.'
            echo '- Require independent exact-SHA Test, migration-set, authenticated backend/API/DB, finance E2E, security and release approval before any manual integration.'
            echo '- No automatic PR merge, branch rewrite/deletion or Production promotion dispatch.'
            echo '- Existing scheduled observer remains enabled; no other worker or reservation is modified.'
          } >> "$GITHUB_STEP_SUMMARY"
