name: Dispatch Test Deploy

on:
  push:
    branches:
      - test

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch isolated test deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run deploy.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref test \
            -f environment=test \
            -f enable_ads=false
