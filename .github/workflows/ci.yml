name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      comparison_base_sha:
        description: Validated comparison base used by the caller release classification
        required: false
        default: ''
        type: string
      classification:
        description: Precomputed immutable release classification from the caller
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  classify:
    runs-on: ubuntu-latest
    outputs:
      classification: ${{ steps.effective.outputs.classification }}
    steps:
      - name: Accept a caller classification only from the closed class set
        id: source
        shell: bash
        env:
          CALLER_CLASSIFICATION: ${{ inputs.classification }}
        run: |
          set -euo pipefail
          value="${CALLER_CLASSIFICATION:-}"
          if [[ -n "$value" ]]; then
            case "$value" in
              DOCS_ONLY|CONTROL_PLANE_ONLY|NO_CHANGES|RUNTIME_RELEVANT|MIXED) ;;
              *) echo "::error::invalid caller release classification: $value"; exit 1 ;;
            esac
          fi
          echo "caller=$value" >> "$GITHUB_OUTPUT"

      - name: Checkout history for standalone CI classification
        if: steps.source.outputs.caller == ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Resolve standalone CI comparison base
        if: steps.source.outputs.caller == ''
        id: base
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          zero=0000000000000000000000000000000000000000
          if [[ "$EVENT_NAME" == pull_request && -n "${PR_BASE_SHA:-}" ]]; then
            base="$PR_BASE_SHA"
          elif [[ "$EVENT_NAME" == push && -n "${EVENT_BEFORE:-}" && "$EVENT_BEFORE" != "$zero" ]] \
            && git cat-file -e "${EVENT_BEFORE}^{commit}" 2>/dev/null; then
            base="$EVENT_BEFORE"
          else
            base="$(git rev-parse HEAD^)"
          fi
          [[ "$base" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$base" >> "$GITHUB_OUTPUT"

      - name: Classify standalone CI before dependency, database, or runtime work
        if: steps.source.outputs.caller == ''
        id: path
        shell: bash
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          node scripts/release/classify-release.mjs \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --output ci-release-input.json \
            --github-output "$GITHUB_OUTPUT"

      - name: Upload standalone immutable CI release input
        if: steps.source.outputs.caller == '' && always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-release-input
          path: ci-release-input.json
          if-no-files-found: error
          retention-days: 30

      - name: Resolve effective CI classification
        id: effective
        shell: bash
        env:
          CALLER_CLASSIFICATION: ${{ steps.source.outputs.caller }}
          STANDALONE_CLASSIFICATION: ${{ steps.path.outputs.classification }}
        run: |
          set -euo pipefail
          value="${CALLER_CLASSIFICATION:-}"
          if [[ -z "$value" ]]; then
            value="${STANDALONE_CLASSIFICATION:-}"
          fi
          case "$value" in
            DOCS_ONLY|CONTROL_PLANE_ONLY|NO_CHANGES|RUNTIME_RELEVANT|MIXED) ;;
            *) echo "::error::missing or unknown release classification: $value"; exit 1 ;;
          esac
          echo "classification=$value" >> "$GITHUB_OUTPUT"

  policy:
    needs: classify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Reject private files and credential leakage in tracked changes
        env:
          SECURITY_BASE_SHA: ${{ inputs.comparison_base_sha || github.event.pull_request.base.sha || github.event.before }}
        run: |
          node --test scripts/security/check-repository-security.test.mjs
          node scripts/security/check-repository-security.mjs

      - name: Test release identity classifier and workflow contract
        run: node --test scripts/release/*.test.mjs

      - name: Test tracked deployment and CI database helpers
        run: |
          python3 ops/systemd/switch-nginx-server-ports.test.py
          node --test packages/database/ci-apply.test.mjs scripts/security/reject-prisma-migrate.test.mjs

      - name: Reject raw control bytes in source
        run: |
          node --test scripts/security/check-control-bytes.test.mjs
          node scripts/security/check-control-bytes.mjs

      - name: Record non-runtime CI decision
        if: >-
          needs.classify.outputs.classification == 'DOCS_ONLY' ||
          needs.classify.outputs.classification == 'CONTROL_PLANE_ONLY' ||
          needs.classify.outputs.classification == 'NO_CHANGES'
        shell: bash
        run: |
          {
            echo '## Lightweight CI lane'
            echo
            echo "- classification: \`${{ needs.classify.outputs.classification }}\`"
            echo '- package install: skipped'
            echo '- application lint/typecheck/build: skipped'
            echo '- PostgreSQL service/migrations/tests: skipped'
            echo '- registry/deployment credentials: unavailable'
          } >> "$GITHUB_STEP_SUMMARY"

  runtime-check:
    needs: [classify, policy]
    if: >-
      needs.classify.outputs.classification == 'RUNTIME_RELEVANT' ||
      needs.classify.outputs.classification == 'MIXED'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_USER: moneyverse_migrator
          POSTGRES_PASSWORD: ci_migrator_password
          # Immutable migration 266 includes ALTER DATABASE woldeok_moneyverse_dev.
          # This PostgreSQL service is an isolated disposable CI container, never a real host DB.
          POSTGRES_DB: woldeok_moneyverse_dev
        options: >-
          --health-cmd "pg_isready -U moneyverse_migrator -d woldeok_moneyverse_dev"
          --health-interval 5s --health-timeout 5s --health-retries 20
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Verify creator ACL boundaries in disposable PostgreSQL
        run: bash packages/database/test/ledger-default-acl-v349.pg.sh

      - run: pnpm install --frozen-lockfile

      - name: Remove any build output
        run: rm -rf packages/*/dist backend/dist frontend/.next
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build

      - name: Apply database migrations
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: moneyverse_migrator
          PGPASSWORD: ci_migrator_password
          PGDATABASE: woldeok_moneyverse_dev
          APP_DB_PASSWORD: ci_app_password
        run: node packages/database/ci-apply.mjs

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: spring-backend/*.gradle.kts

      - name: Verify native messaging with disposable PostgreSQL
        working-directory: spring-backend
        env:
          CI_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          MONEYVERSE_MESSAGING_PG_TEST_URL: jdbc:postgresql://127.0.0.1:5432/woldeok_moneyverse_dev
          MONEYVERSE_MESSAGING_PG_TEST_USER: moneyverse_migrator
        run: |
          node --input-type=module -e '
            import {execFileSync,spawnSync} from "node:child_process";
            const container=process.env.CI_POSTGRES_CONTAINER;
            if(process.env.GITHUB_ACTIONS!=="true"||!/^[a-f0-9]{12,64}$/.test(container||""))throw new Error("Disposable CI service required");
            let password;
            try {
              password=execFileSync("docker",["exec",container,"printenv","POSTGRES_PASSWORD"],{encoding:"utf8",stdio:["ignore","pipe","pipe"]}).replace(/\r?\n$/,"");
            } catch {throw new Error("Disposable service credential unavailable");}
            if(!password||password.includes("\n")||password.includes("\0"))throw new Error("Invalid disposable service credential");
            const result=spawnSync("./gradlew",["postgresMessagingTest","--no-daemon","-Dorg.gradle.workers.max=2"],{
              env:{...process.env,MONEYVERSE_MESSAGING_PG_TEST_PASSWORD:password},stdio:"inherit"
            });
            if(result.error)throw new Error("Native PostgreSQL verifier could not start");
            process.exit(result.status??1);
          '

      - name: Test
        env:
          DATABASE_URL: postgresql://moneyverse_app:ci_app_password@localhost:5432/woldeok_moneyverse_dev
          MIGRATOR_DATABASE_URL: postgresql://moneyverse_migrator:ci_migrator_password@localhost:5432/woldeok_moneyverse_dev
        run: pnpm test

      - name: Reject Prisma schema mutation
        run: node scripts/security/reject-prisma-migrate.mjs

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

      - name: Verify and audit separately locked Discord bot
        # Bot unit/security tests do not play music or require a yt-dlp binary.
        # Avoid yt-dlp GitHub release API rate limits in disposable CI only.
        env:
          YOUTUBE_DL_SKIP_DOWNLOAD: 'true'
        run: |
          npm --prefix bot ci --no-audit --no-fund
          npm --prefix bot test
          npm --prefix bot audit --omit=dev --audit-level=high

  spring-web-check:
    needs: [classify, policy]
    if: >-
      needs.classify.outputs.classification == 'RUNTIME_RELEVANT' ||
      needs.classify.outputs.classification == 'MIXED'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SPRING_PROFILES_ACTIVE: test
      SERVER_ADDRESS: 127.0.0.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: spring-backend/*.gradle.kts
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Test native UI locale, navigation and money contracts
        run: node --test scripts/native-*.test.mjs scripts/admin-tools.test.mjs scripts/mv39-money.test.mjs
      - name: Test and build the native Spring application
        working-directory: spring-backend
        run: ./gradlew test bootJar --no-daemon -Dorg.gradle.workers.max=2
      - name: Bind native artifact to exact source
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            import crypto from "node:crypto";
            const dir="spring-backend/build/libs";
            const jars=fs.readdirSync(dir).filter(name=>name.endsWith(".jar")&&!name.endsWith("-plain.jar"));
            if(jars.length!==1)throw new Error("Expected one native boot JAR");
            const file=dir+"/"+jars[0];
            const sha256=crypto.createHash("sha256").update(fs.readFileSync(file)).digest("hex");
            fs.writeFileSync(dir+"/source-manifest.json",JSON.stringify({sourceSha:process.env.GITHUB_SHA,jar:jars[0],sha256})+"\n");
          '
      - name: Upload source-bound native candidate
        uses: actions/upload-artifact@v4
        with:
          name: spring-native-candidate-${{ github.sha }}
          path: |
            spring-backend/build/libs/*.jar
            spring-backend/build/libs/source-manifest.json
          if-no-files-found: error
          retention-days: 14
