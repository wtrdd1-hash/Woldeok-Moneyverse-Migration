name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Called by deploy.yml so a deployment cannot skip the checks.
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17.5-alpine
        env:
          POSTGRES_USER: moneyverse_migrator
          POSTGRES_PASSWORD: ci_migrator_password
          POSTGRES_DB: woldeok_moneyverse_ci
        options: >-
          --health-cmd "pg_isready -U moneyverse_migrator -d woldeok_moneyverse_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v7

      # First, because it needs nothing but the checkout and because a leaked
      # credential is the one failure whose cost grows for as long as it goes
      # unnoticed. Every secret this project uses is generated on the host or
      # held by GitHub, so anything credential-shaped in a tracked file is a
      # mistake -- see the script for the conventions it relies on.
      - name: Reject a committed secret
        run: scripts/check-secrets.sh

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # A stale dist from an earlier run hides an ordering defect: a consumer
      # typechecks against build output that a clean checkout would not have.
      # That is exactly what got through review once, so the checks below run
      # from nothing.
      - name: Remove any build output
        run: rm -rf packages/*/dist backend/dist frontend/.next
      - run: pnpm lint

      # ESLint cannot tell a backslash-u escape from the raw byte it denotes.
      # This can, and that substitution has silently broken input sanitisation
      # in this codebase's history.
      - name: Reject raw control bytes in source
        run: scripts/check-control-bytes.sh
      - run: pnpm typecheck
      - run: pnpm build

      # The development machine has no container runtime and no PostgreSQL
      # server, so CI is where database-backed tests actually execute.
      - name: Apply database migrations
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: moneyverse_migrator
          PGPASSWORD: ci_migrator_password
          PGDATABASE: woldeok_moneyverse_ci
          APP_DB_PASSWORD: ci_app_password
        run: packages/database/ci-apply.sh

      # Two connections, because two things are being proved. DATABASE_URL is
      # the role the application actually runs as, and almost every database
      # test asserts what that role can and cannot reach. MIGRATOR_DATABASE_URL
      # is for the handful of guards that live on tables the application cannot
      # write at all -- the casino's activation trigger is the first -- which
      # can only be exercised by the role that owns the schema. Those tests run
      # inside transactions they roll back; a run without this variable skips
      # them rather than reporting a guard nobody checked.
      - name: Test
        env:
          DATABASE_URL: postgresql://moneyverse_app:ci_app_password@localhost:5432/woldeok_moneyverse_ci
          MIGRATOR_DATABASE_URL: postgresql://moneyverse_migrator:ci_migrator_password@localhost:5432/woldeok_moneyverse_ci
        run: pnpm test

      # Prisma introspects the schema; it never owns it. The guard lives in a
      # script so it cannot match its own source -- spelling the phrase
      # inline here made the first version fail on every run.
      - name: Reject Prisma schema mutation
        run: scripts/reject-prisma-migrate.sh

      # --prod, because an advisory in a build tool cannot reach a request and
      # blocking every unrelated pull request on one is how a gate stops being
      # read. --audit-level=high for the same reason: what is gated here is the
      # class of advisory that would justify an out-of-band release.
      #
      # It runs last on purpose. It is the only step that talks to the registry
      # rather than to this checkout, so an outage here should not hide a real
      # failure in the steps above it.
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high
