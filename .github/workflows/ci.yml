name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      classification:
        description: Precomputed immutable release classification from the caller
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  classify:
    runs-on: ubuntu-latest
    outputs:
      classification: ${{ steps.effective.outputs.classification }}
    steps:
      - name: Accept a caller classification only from the closed class set
        id: source
        shell: bash
        env:
          CALLER_CLASSIFICATION: ${{ inputs.classification }}
        run: |
          set -euo pipefail
          value="${CALLER_CLASSIFICATION:-}"
          if [[ -n "$value" ]]; then
            case "$value" in
              DOCS_ONLY|CONTROL_PLANE_ONLY|RUNTIME_RELEVANT|MIXED) ;;
              *) echo "::error::invalid caller release classification: $value"; exit 1 ;;
            esac
          fi
          echo "caller=$value" >> "$GITHUB_OUTPUT"

      - name: Checkout history for standalone CI classification
        if: steps.source.outputs.caller == ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Resolve standalone CI comparison base
        if: steps.source.outputs.caller == ''
        id: base
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          zero=0000000000000000000000000000000000000000
          if [[ "$EVENT_NAME" == pull_request && -n "${PR_BASE_SHA:-}" ]]; then
            base="$PR_BASE_SHA"
          elif [[ "$EVENT_NAME" == push && -n "${EVENT_BEFORE:-}" && "$EVENT_BEFORE" != "$zero" ]] \
            && git cat-file -e "${EVENT_BEFORE}^{commit}" 2>/dev/null; then
            base="$EVENT_BEFORE"
          else
            base="$(git rev-parse HEAD^)"
          fi
          [[ "$base" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$base" >> "$GITHUB_OUTPUT"

      - name: Classify standalone CI before dependency, database, or runtime work
        if: steps.source.outputs.caller == ''
        id: path
        shell: bash
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          node scripts/release/classify-release.mjs \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --output ci-release-input.json \
            --github-output "$GITHUB_OUTPUT"

      - name: Upload standalone immutable CI release input
        if: steps.source.outputs.caller == '' && always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-release-input
          path: ci-release-input.json
          if-no-files-found: error
          retention-days: 30

      - name: Resolve effective CI classification
        id: effective
        shell: bash
        env:
          CALLER_CLASSIFICATION: ${{ steps.source.outputs.caller }}
          STANDALONE_CLASSIFICATION: ${{ steps.path.outputs.classification }}
        run: |
          set -euo pipefail
          value="${CALLER_CLASSIFICATION:-}"
          if [[ -z "$value" ]]; then
            value="${STANDALONE_CLASSIFICATION:-}"
          fi
          case "$value" in
            DOCS_ONLY|CONTROL_PLANE_ONLY|RUNTIME_RELEVANT|MIXED) ;;
            *) echo "::error::missing or unknown release classification: $value"; exit 1 ;;
          esac
          echo "classification=$value" >> "$GITHUB_OUTPUT"

  policy:
    needs: classify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Reject a committed secret
        run: scripts/check-secrets.sh

      - name: Test release identity classifier and workflow contract
        run: node --test scripts/release/*.test.mjs

      - name: Test host systemd release helpers
        shell: bash
        run: |
          set -euo pipefail
          bash -n ops/systemd/*.sh
          ops/systemd/prepare-frontend-runtime-cache.test.sh
          ops/systemd/write-test-release-env.test.sh
          ops/nginx/check-moneyverse-host-routing.test.sh

      - name: Reject raw control bytes in source
        run: scripts/check-control-bytes.sh

      - name: Record non-runtime CI decision
        if: >-
          needs.classify.outputs.classification == 'DOCS_ONLY' ||
          needs.classify.outputs.classification == 'CONTROL_PLANE_ONLY'
        shell: bash
        run: |
          {
            echo '## Lightweight CI lane'
            echo
            echo "- classification: \`${{ needs.classify.outputs.classification }}\`"
            echo '- package install: skipped'
            echo '- application lint/typecheck/build: skipped'
            echo '- PostgreSQL service/migrations/tests: skipped'
            echo '- registry/deployment credentials: unavailable'
          } >> "$GITHUB_STEP_SUMMARY"

  runtime-check:
    needs: [classify, policy]
    if: >-
      needs.classify.outputs.classification == 'RUNTIME_RELEVANT' ||
      needs.classify.outputs.classification == 'MIXED'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_USER: moneyverse_migrator
          POSTGRES_PASSWORD: ci_migrator_password
          POSTGRES_DB: woldeok_moneyverse_ci
        options: >-
          --health-cmd "pg_isready -U moneyverse_migrator -d woldeok_moneyverse_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Remove any build output
        run: rm -rf packages/*/dist backend/dist frontend/.next
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build

      - name: Apply database migrations
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: moneyverse_migrator
          PGPASSWORD: ci_migrator_password
          PGDATABASE: woldeok_moneyverse_ci
          APP_DB_PASSWORD: ci_app_password
        run: packages/database/ci-apply.sh

      - name: Test
        env:
          DATABASE_URL: postgresql://moneyverse_app:ci_app_password@localhost:5432/woldeok_moneyverse_ci
          MIGRATOR_DATABASE_URL: postgresql://moneyverse_migrator:ci_migrator_password@localhost:5432/woldeok_moneyverse_ci
        run: pnpm test

      - name: Reject Prisma schema mutation
        run: scripts/reject-prisma-migrate.sh

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high
