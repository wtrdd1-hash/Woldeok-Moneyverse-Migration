name: Export Encrypted Deploy Credential

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    steps:
      - name: Checkout exact workflow revision
        uses: actions/checkout@v7

      - name: Verify one-time wrapping certificate
        shell: bash
        run: |
          set -euo pipefail
          cert='ops/recovery/wdmv-flux-recovery-v149-cert.pem'
          test -s "$cert"
          fingerprint="$(openssl x509 -in "$cert" -noout -fingerprint -sha256 | cut -d= -f2)"
          test "$fingerprint" = '70:76:56:2C:D9:E9:9F:86:7D:CA:3E:1A:0C:1D:DF:66:F7:F3:70:0C:E7:9A:D6:55:80:25:06:59:76:A3:A7:D1'

      - name: Wrap existing deploy credential
        shell: bash
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          [[ -n "${DEPLOY_USER:-}" ]]
          [[ -n "${DEPLOY_SSH_KEY:-}" ]]
          umask 077
          bundle="$(mktemp -d)"
          cleanup() { rm -rf "$bundle" /tmp/wdmv-deploy-credential.tar.gz; }
          trap cleanup EXIT
          printf '%s' "$DEPLOY_USER" > "$bundle/user"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$bundle/id_deploy"
          chmod 600 "$bundle/id_deploy" "$bundle/user"
          tar -czf /tmp/wdmv-deploy-credential.tar.gz -C "$bundle" user id_deploy
          openssl cms -encrypt -binary -aes256 \
            -in /tmp/wdmv-deploy-credential.tar.gz \
            -out /tmp/wdmv-deploy-credential.cms \
            -outform DER \
            ops/recovery/wdmv-flux-recovery-v149-cert.pem
          test -s /tmp/wdmv-deploy-credential.cms
          echo 'Created CMS ciphertext only; plaintext bundle removed by trap.'

      - name: Upload ciphertext only
        uses: actions/upload-artifact@v7
        with:
          name: wdmv-flux-recovery-v149-ciphertext
          path: /tmp/wdmv-deploy-credential.cms
          if-no-files-found: error
          retention-days: 1
