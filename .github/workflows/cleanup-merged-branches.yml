name: Cleanup Merged Branches

on:
  pull_request:
    types: [closed]
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

# Incident #1663: inventory only. Even an apparently merged head must be
# independently reviewed before any PR closure or remote branch deletion.
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: cleanup-merged-branches
  cancel-in-progress: false

jobs:
  inventory-merged-pr-branches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          # Read-only checkout credentials are needed to fetch private branch refs.
          persist-credentials: true

      - name: Inventory branch retention evidence (no mutation)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          main_sha="$(git rev-parse refs/remotes/origin/main)"
          merged_evidence="$(mktemp)"
          open_heads="$(mktemp)"
          trap 'rm -f "$merged_evidence" "$open_heads"' EXIT

          # A closed-but-unmerged PR is not merge evidence. API errors abort
          # the inventory rather than turning missing data into cleanup proof.
          gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls?state=closed&base=main&per_page=100" \
            --jq '.[] | select(.merged_at != null and (.head.repo.full_name // "") == .base.repo.full_name) | [.head.ref, .head.sha, (.number|tostring)] | @tsv' > "$merged_evidence"
          gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls?state=open&base=main&per_page=100" \
            --jq '.[] | select((.head.repo.full_name // "") == .base.repo.full_name) | .head.ref' > "$open_heads"

          active=0
          merged_and_contained=0
          preserved_other=0
          while read -r branch branch_sha; do
            [[ "$branch" == main ]] && continue
            if grep -Fxq "$branch" "$open_heads"; then
              active=$((active + 1))
              continue
            fi
            merged_pr="$(awk -F '\t' -v b="$branch" -v s="$branch_sha" '$1==b && $2==s {print $3;exit}' "$merged_evidence")"
            if [[ -n "$merged_pr" ]] && git merge-base --is-ancestor "$branch_sha" "$main_sha"; then
              echo "REVIEW ONLY: merged PR #${merged_pr} head contained in main: ${branch} ${branch_sha}"
              merged_and_contained=$((merged_and_contained + 1))
            else
              preserved_other=$((preserved_other + 1))
            fi
          done < <(git for-each-ref --format='%(refname:strip=3) %(objectname)' refs/remotes/origin)

          {
            echo '## Read-only merged branch retention inventory'
            echo
            echo "- main SHA: ${main_sha}"
            echo "- branches with open PRs: ${active}"
            echo "- merged and ancestor-confirmed heads (review only): ${merged_and_contained}"
            echo "- other retained heads: ${preserved_other}"
            echo '- PRs closed: 0; branches deleted: 0; releases dispatched: 0'
          } >> "$GITHUB_STEP_SUMMARY"
