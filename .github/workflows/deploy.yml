name: Deploy

# Ships the source to the host over SSH and rebuilds there.
#
# Deliberately no registry. Publishing would buy SHA-tagged images and a
# one-line rollback, at the cost of a pull credential the host must hold and a
# package that has to be curated. The host has sixteen cores and spare memory,
# a warm rebuild takes about a second, and this deployment has no history to
# roll back to — so the trade is not worth its one manual setup step. If
# rollback becomes a real need, this file is what changes.
#
# Deployment is gated on the CI workflow passing, and on a manual dispatch or
# a push to main.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Which deployment to roll
        required: true
        default: staging
        type: choice
        options: [staging, production]

concurrency:
  # Never let two deploys touch the host at once; the later one waits rather
  # than interleaving with a half-finished rollout.
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'staging' }}
    steps:
      - uses: actions/checkout@v4

      - name: Open an SSH session to the host
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          # Pinned host key rather than StrictHostKeyChecking=no: accepting
          # whatever key answers would let anyone who can spoof the address
          # receive the deploy credentials.
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<'CONFIG'
          Host target
            HostName ${{ secrets.DEPLOY_HOST }}
            User ${{ secrets.DEPLOY_USER }}
            Port ${{ secrets.DEPLOY_PORT }}
            IdentityFile ~/.ssh/deploy
            IdentitiesOnly yes
          CONFIG
          chmod 600 ~/.ssh/config

      - name: Ship the deployment files
        run: |
          ssh target 'mkdir -p ~/moneyverse-migration'
          tar czf - \
            -C deploy compose.yml nginx.conf roll.sh bootstrap-env.sh \
            -C "${GITHUB_WORKSPACE}/packages/database" init migrations migrate.sh \
            | ssh target 'tar xzf - -C ~/moneyverse-migration'

      - name: Ship the source the host builds from
        run: |
          # git archive, so only tracked files travel: no node_modules, no
          # .next, no local .env that happens to be lying around.
          git archive --format=tar.gz -o /tmp/src.tar.gz HEAD
          ssh target 'cat > ~/moneyverse-migration/src.tar.gz' < /tmp/src.tar.gz

      # The script runs on the host and reads its inputs from the environment.
      # Passing it as a here-doc let the runner's shell expand the body first,
      # which rewrote the script before it ever arrived.
      #
      # ADOPT_FROM names a container already running on the host whose OAuth
      # client credentials this deployment reuses. The values are copied
      # host-locally and never pass through this runner.
      - name: Roll the deployment
        run: |
          ssh target \
            "APP_BASE_URL='${{ vars.APP_BASE_URL || 'https://migration.easy-scraping.com' }}'" \
            "ADOPT_FROM='${{ vars.ADOPT_FROM }}'" \
            'bash ~/moneyverse-migration/roll.sh'

      - name: Report what is running
        if: always()
        run: ssh target 'cd ~/moneyverse-migration && docker compose ps'
