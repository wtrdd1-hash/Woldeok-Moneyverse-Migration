name: Deploy

# Builds the container image, publishes it to GHCR, and rolls the deployment
# on the host over SSH.
#
# The repository is private, so the image is private too. Two different
# credentials are involved and they are not interchangeable:
#
#   - Publishing uses the workflow's own GITHUB_TOKEN with packages: write.
#     Nothing needs to be configured for it.
#   - Pulling happens on the host, which is outside GitHub and cannot use that
#     token. It logs in with GHCR_PULL_TOKEN, a personal access token that
#     needs only read:packages.
#
# Deployment is gated on the CI workflow passing, and on a manual dispatch or
# a push to main.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Which deployment to roll
        required: true
        default: staging
        type: choice
        options: [staging, production]

concurrency:
  # Never let two deploys touch the host at once; the later one waits rather
  # than interleaving with a half-finished rollout.
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/backend

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  build:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute the image reference
        id: meta
        run: |
          # Lowercase: a repository owner may contain capitals, an image name
          # may not.
          name=$(echo "${REGISTRY}/${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')
          echo "image=${name}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "name=${name}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'staging' }}
    steps:
      - uses: actions/checkout@v4

      - name: Open an SSH session to the host
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          # Pinned host key rather than StrictHostKeyChecking=no: accepting
          # whatever key answers would let anyone who can spoof the address
          # receive the deploy credentials.
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<'CONFIG'
          Host target
            HostName ${{ secrets.DEPLOY_HOST }}
            User ${{ secrets.DEPLOY_USER }}
            Port ${{ secrets.DEPLOY_PORT }}
            IdentityFile ~/.ssh/deploy
            IdentitiesOnly yes
          CONFIG
          chmod 600 ~/.ssh/config

      - name: Ship the compose file and the migrations
        run: |
          ssh target 'mkdir -p ~/moneyverse-migration'
          tar czf - \
            -C deploy compose.yml \
            -C "${GITHUB_WORKSPACE}/packages/database" init migrations migrate.sh \
            | ssh target 'tar xzf - -C ~/moneyverse-migration'

      - name: Roll the deployment
        run: |
          ssh target bash -euo pipefail -s <<REMOTE
          cd ~/moneyverse-migration

          # The host cannot use the workflow's GITHUB_TOKEN, so it logs in
          # with a read:packages token of its own.
          echo '${{ secrets.GHCR_PULL_TOKEN }}' \
            | docker login ghcr.io -u '${{ github.actor }}' --password-stdin

          # Recorded in .env rather than exported for one command, so that a
          # later `docker compose ps` or `logs` resolves the same image an
          # operator is looking at.
          sed -i '/^BACKEND_IMAGE=/d' .env
          echo "BACKEND_IMAGE=${{ needs.build.outputs.image }}" >> .env
          docker compose pull backend
          docker compose up -d --wait --wait-timeout 180
          docker logout ghcr.io
          REMOTE

      - name: Verify the deployment answers
        run: |
          ssh target bash -euo pipefail -s <<'REMOTE'
          cd ~/moneyverse-migration
          port="\${BACKEND_PORT:-3020}"
          # --wait above already required the healthcheck to pass; this asks
          # from outside the container, which is how the reverse proxy will.
          code=\$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "http://127.0.0.1:\${port}/health")
          if [ "\$code" != "200" ]; then
            echo "health check answered \$code" >&2
            docker compose logs --tail 50 backend >&2
            exit 1
          fi
          echo "deployment healthy"
          REMOTE

      - name: Report what is running
        if: always()
        run: ssh target 'cd ~/moneyverse-migration && docker compose ps'
