name: Build Production Release

on:
  workflow_dispatch:
    inputs:
      enable_ads:
        description: Enable the reviewed AdSense unit in the production frontend image
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

concurrency:
  group: build-production-release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/wdmv

jobs:
  ref:
    runs-on: ubuntu-latest
    steps:
      - name: Enforce production branch policy
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" != 'refs/heads/main' ]; then
            echo '::error::production release images may only be built from main'
            exit 1
          fi
          echo "preparing immutable production images for ${GITHUB_SHA}"

  verify:
    needs: ref
    uses: ./.github/workflows/ci.yml

  build:
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    outputs:
      backend: ${{ steps.meta.outputs.backend }}
      frontend: ${{ steps.meta.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute immutable image references
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          prefix=$(echo "${REGISTRY}/${IMAGE_PREFIX}" | tr '[:upper:]' '[:lower:]')
          echo "backend=${prefix}/backend:${GITHUB_SHA}-production" >> "$GITHUB_OUTPUT"
          echo "frontend=${prefix}/frontend:${GITHUB_SHA}-production" >> "$GITHUB_OUTPUT"
      - name: Build and push backend
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          push: true
          platforms: linux/amd64
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.backend }}
          cache-from: type=gha,scope=backend-production
          cache-to: type=gha,mode=max,scope=backend-production
      - name: Build and push frontend
        uses: docker/build-push-action@v7
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          platforms: linux/amd64
          provenance: mode=max
          sbom: true
          build-args: |
            APP_BASE_URL=https://easy-scraping.com
            SEO_INDEXING_ENABLED=true
            SEARCH_CONSOLE_VERIFICATION=${{ vars.SEARCH_CONSOLE_VERIFICATION }}
            ADS_ENABLED=${{ inputs.enable_ads && 'true' || 'false' }}
            ADSENSE_PUBLISHER_ID=${{ inputs.enable_ads && 'ca-pub-5220225531544323' || '' }}
            ADSENSE_HOME_SLOT=${{ inputs.enable_ads && '2118692561' || '' }}
          tags: ${{ steps.meta.outputs.frontend }}
          cache-from: type=gha,scope=frontend-production
          cache-to: type=gha,mode=max,scope=frontend-production
      - name: Write GitOps promotion summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '## Production images built'
            echo
            echo 'This workflow intentionally does not mutate the production cluster.'
            echo 'Production is reconciled by Flux from wtrdd1-hash/kuber-infrastructure.'
            echo
            echo "- backend: \`${{ steps.meta.outputs.backend }}\`"
            echo "- frontend: \`${{ steps.meta.outputs.frontend }}\`"
            echo
            echo 'Promote by updating apps/minipc/wdmvp/backend.yaml and frontend.yaml in the GitOps repository through a reviewed PR.'
            echo 'After merge, require Flux Ready, Kubernetes rollout completion, public smoke checks, and the production data-integrity audit before reporting success.'
          } >> "$GITHUB_STEP_SUMMARY"
