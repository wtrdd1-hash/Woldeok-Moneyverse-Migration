name: Build Production Release

on:
  workflow_run:
    workflows: [Build Test Candidate]
    types: [completed]
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Successful main Build Test Candidate run containing the immutable release/candidate manifest
        required: true
        type: string
      enable_ads:
        description: Enable the reviewed AdSense unit in the production frontend image (default on)
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: build-production-release-${{ github.event.workflow_run.id || inputs.candidate_run_id || github.run_id }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/wdmv

jobs:
  prepare:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      candidate_run_id: ${{ steps.run.outputs.id }}
      repository_head_sha: ${{ steps.release.outputs.repository_head_sha }}
      application_source_sha: ${{ steps.release.outputs.application_source_sha }}
      control_plane_sha: ${{ steps.release.outputs.control_plane_sha }}
      classification: ${{ steps.release.outputs.classification }}
      changed_paths_hash: ${{ steps.release.outputs.changed_paths_hash }}
      migration_set_hash: ${{ steps.release.outputs.migration_set_hash }}
      classifier_version: ${{ steps.release.outputs.classifier_version }}
      requires_runtime: ${{ steps.release.outputs.requires_runtime }}
      backend_candidate_image: ${{ steps.candidate.outputs.backend_candidate_image }}
      backend_candidate_digest: ${{ steps.candidate.outputs.backend_candidate_digest }}
      frontend_candidate_image: ${{ steps.candidate.outputs.frontend_candidate_image }}
      frontend_candidate_digest: ${{ steps.candidate.outputs.frontend_candidate_digest }}
      test_deployment_id: ${{ steps.candidate.outputs.test_deployment_id }}
    steps:
      - name: Resolve attested candidate workflow run
        id: run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
          INPUT_RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == workflow_run ]]; then
            run_id="$EVENT_RUN_ID"
          else
            run_id="$INPUT_RUN_ID"
          fi
          [[ "$run_id" =~ ^[0-9]+$ ]] || { echo '::error::candidate_run_id must be a GitHub Actions run id'; exit 1; }
          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")"
          jq -e \
            '.name == "Build Test Candidate" and .head_branch == "main" and .status == "completed" and .conclusion == "success"' \
            <<<"$run_json" >/dev/null || {
              echo '::error::candidate_run_id must identify a successful main Build Test Candidate run'
              exit 1
            }
          head_sha="$(jq -r '.head_sha' <<<"$run_json")"
          [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]]
          echo "id=$run_id" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"

      - name: Download immutable release input from candidate run
        uses: actions/download-artifact@v4
        with:
          name: release-input
          path: release-evidence
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.run.outputs.id }}

      - name: Validate release input before Production environment or registry access
        id: release
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ steps.run.outputs.head_sha }}
        run: |
          set -euo pipefail
          file=release-evidence/release-input.json
          test -s "$file"
          jq -e \
            --arg head "$EXPECTED_HEAD_SHA" \
            '.schemaVersion == 1 and .classifierVersion == "release-path-v1" and .repositoryHeadSha == $head and (.classification == "DOCS_ONLY" or .classification == "CONTROL_PLANE_ONLY" or .classification == "RUNTIME_RELEVANT" or .classification == "MIXED")' \
            "$file" >/dev/null || {
              echo '::error::release input is missing, stale, unknown, or does not belong to the selected candidate run'
              exit 1
            }
          classification="$(jq -r '.classification' "$file")"
          repository_head_sha="$(jq -r '.repositoryHeadSha' "$file")"
          application_source_sha="$(jq -r '.applicationSourceSha // empty' "$file")"
          control_plane_sha="$(jq -r '.controlPlaneSha // empty' "$file")"
          changed_paths_hash="$(jq -r '.changedPathsHash' "$file")"
          migration_set_hash="$(jq -r '.migrationSetHash' "$file")"
          classifier_version="$(jq -r '.classifierVersion' "$file")"
          requires_runtime=false
          if [[ "$classification" == RUNTIME_RELEVANT || "$classification" == MIXED ]]; then
            requires_runtime=true
            [[ "$application_source_sha" =~ ^[0-9a-f]{40}$ ]] || {
              echo '::error::runtime classification requires applicationSourceSha'
              exit 1
            }
          fi
          {
            echo "classification=$classification"
            echo "repository_head_sha=$repository_head_sha"
            echo "application_source_sha=$application_source_sha"
            echo "control_plane_sha=$control_plane_sha"
            echo "changed_paths_hash=$changed_paths_hash"
            echo "migration_set_hash=$migration_set_hash"
            echo "classifier_version=$classifier_version"
            echo "requires_runtime=$requires_runtime"
          } >> "$GITHUB_OUTPUT"

      - name: Download runtime candidate manifest only for runtime release lanes
        if: steps.release.outputs.requires_runtime == 'true'
        uses: actions/download-artifact@v4
        with:
          name: candidate-manifest
          path: candidate-evidence
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.run.outputs.id }}

      - name: Validate immutable runtime candidate manifest
        id: candidate
        if: steps.release.outputs.requires_runtime == 'true'
        shell: bash
        env:
          CANDIDATE_RUN_ID: ${{ steps.run.outputs.id }}
          REPOSITORY_HEAD_SHA: ${{ steps.release.outputs.repository_head_sha }}
          APPLICATION_SOURCE_SHA: ${{ steps.release.outputs.application_source_sha }}
          MIGRATION_SET_HASH: ${{ steps.release.outputs.migration_set_hash }}
        run: |
          set -euo pipefail
          file=candidate-evidence/candidate-manifest.json
          test -s "$file"
          jq -e \
            --argjson run "$CANDIDATE_RUN_ID" \
            --arg repo "$REPOSITORY_HEAD_SHA" \
            --arg app "$APPLICATION_SOURCE_SHA" \
            --arg migrations "$MIGRATION_SET_HASH" \
            '.schemaVersion == 1 and .candidateRunId == $run and .repositoryHeadSha == $repo and .applicationSourceSha == $app and .migrationSetHash == $migrations and (.classification == "RUNTIME_RELEVANT" or .classification == "MIXED") and (.backendDigest | test("^sha256:[0-9a-f]{64}$")) and (.frontendDigest | test("^sha256:[0-9a-f]{64}$")) and (.deploymentId | type == "number")' \
            "$file" >/dev/null || {
              echo '::error::candidate manifest does not match the selected release input'
              exit 1
            }
          backend_image="$(jq -r '.backendImage' "$file")"
          backend_digest="$(jq -r '.backendDigest' "$file")"
          frontend_image="$(jq -r '.frontendImage' "$file")"
          frontend_digest="$(jq -r '.frontendDigest' "$file")"
          deployment_id="$(jq -r '.deploymentId' "$file")"
          [[ "$backend_image" == *":${APPLICATION_SOURCE_SHA}-test" ]]
          [[ "$frontend_image" == *":${APPLICATION_SOURCE_SHA}-test" ]]
          {
            echo "backend_candidate_image=$backend_image"
            echo "backend_candidate_digest=$backend_digest"
            echo "frontend_candidate_image=$frontend_image"
            echo "frontend_candidate_digest=$frontend_digest"
            echo "test_deployment_id=$deployment_id"
          } >> "$GITHUB_OUTPUT"

      - name: Summarize non-runtime release classification
        if: steps.release.outputs.requires_runtime != 'true'
        shell: bash
        run: |
          {
            echo '## Runtime release intentionally skipped'
            echo
            echo "- repository head: \`${{ steps.release.outputs.repository_head_sha }}\`"
            echo "- application source remains: \`${{ steps.release.outputs.application_source_sha }}\`"
            echo "- classification: \`${{ steps.release.outputs.classification }}\`"
            echo '- isolated-Test application polling: skipped'
            echo '- Production environment/registry access: skipped'
            echo '- Production image build/deployment signal: skipped'
          } >> "$GITHUB_STEP_SUMMARY"

  test-gate:
    needs: prepare
    if: needs.prepare.outputs.requires_runtime == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    outputs:
      observed_application_sha: ${{ steps.verify.outputs.observed_application_sha }}
    env:
      APPLICATION_SOURCE_SHA: ${{ needs.prepare.outputs.application_source_sha }}
      REPOSITORY_HEAD_SHA: ${{ needs.prepare.outputs.repository_head_sha }}
      MIGRATION_SET_HASH: ${{ needs.prepare.outputs.migration_set_hash }}
      TEST_DEPLOYMENT_ID: ${{ needs.prepare.outputs.test_deployment_id }}
      BACKEND_CANDIDATE_DIGEST: ${{ needs.prepare.outputs.backend_candidate_digest }}
      FRONTEND_CANDIDATE_DIGEST: ${{ needs.prepare.outputs.frontend_candidate_digest }}
    steps:
      - name: Verify pending deployment identity before Test polling
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          deployment="$(gh api "repos/${GITHUB_REPOSITORY}/deployments/${TEST_DEPLOYMENT_ID}")"
          jq -e \
            --arg app "$APPLICATION_SOURCE_SHA" \
            '.ref == $app and .environment == "isolated-test"' \
            <<<"$deployment" >/dev/null || {
              echo '::error::candidate deployment id is not bound to the attested application source'
              exit 1
            }

      - name: Wait for attested application source on isolated Test and verify backend/database path
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          for _ in $(seq 1 60); do
            version="$(curl -fsS --max-time 10 https://test.easy-scraping.com/api/version 2>/dev/null | jq -r '.id // empty' || true)"
            if [[ "$version" == "$APPLICATION_SOURCE_SHA" ]]; then
              curl -fsS --max-time 15 https://test.easy-scraping.com/app-api/v1/shop/public-catalog \
                | jq -e '.catalogItems | type == "array" and length > 0' >/dev/null
              headers="$(curl -fsSI --max-time 10 https://test.easy-scraping.com/ || true)"
              grep -Eiq '^x-robots-tag:.*noindex' <<<"$headers"
              echo "observed_application_sha=$version" >> "$GITHUB_OUTPUT"
              echo "isolated Test verified attested application source $APPLICATION_SOURCE_SHA for repository head $REPOSITORY_HEAD_SHA"
              exit 0
            fi
            sleep 15
          done
          echo "::error::isolated Test never served attested application source $APPLICATION_SOURCE_SHA"
          exit 1

      - name: Mark isolated-Test deployment attested
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          status_payload="$(jq -n '{state:"success",environment:"isolated-test",environment_url:"https://test.easy-scraping.com",description:"Exact application source, backend/database path and noindex gate verified",auto_inactive:false}')"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/deployments/${TEST_DEPLOYMENT_ID}/statuses" --input - <<<"$status_payload" >/dev/null

      - name: Write isolated-Test attestation
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --arg repositoryHeadSha "$REPOSITORY_HEAD_SHA" \
            --arg applicationSourceSha "$APPLICATION_SOURCE_SHA" \
            --arg migrationSetHash "$MIGRATION_SET_HASH" \
            --arg backendCandidateDigest "$BACKEND_CANDIDATE_DIGEST" \
            --arg frontendCandidateDigest "$FRONTEND_CANDIDATE_DIGEST" \
            --argjson deploymentId "$TEST_DEPLOYMENT_ID" \
            --arg verifiedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{schemaVersion:1,repositoryHeadSha:$repositoryHeadSha,applicationSourceSha:$applicationSourceSha,migrationSetHash:$migrationSetHash,backendCandidateDigest:$backendCandidateDigest,frontendCandidateDigest:$frontendCandidateDigest,deploymentId:$deploymentId,verifiedAt:$verifiedAt,checks:["api-version","public-catalog","test-noindex"]}' \
            > test-attestation.json

      - name: Upload isolated-Test attestation
        uses: actions/upload-artifact@v4
        with:
          name: test-attestation
          path: test-attestation.json
          if-no-files-found: error
          retention-days: 30

  build:
    needs: [prepare, test-gate]
    if: needs.prepare.outputs.requires_runtime == 'true' && needs.test-gate.result == 'success'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
      deployments: write
    env:
      APPLICATION_SOURCE_SHA: ${{ needs.prepare.outputs.application_source_sha }}
      REPOSITORY_HEAD_SHA: ${{ needs.prepare.outputs.repository_head_sha }}
      MIGRATION_SET_HASH: ${{ needs.prepare.outputs.migration_set_hash }}
      TEST_DEPLOYMENT_ID: ${{ needs.prepare.outputs.test_deployment_id }}
      BACKEND_CANDIDATE_DIGEST: ${{ needs.prepare.outputs.backend_candidate_digest }}
      FRONTEND_CANDIDATE_DIGEST: ${{ needs.prepare.outputs.frontend_candidate_digest }}
    steps:
      - name: Checkout attested application source after isolated-Test gate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.APPLICATION_SOURCE_SHA }}

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR after classification and isolated-Test attestation
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute immutable production image references
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          prefix=$(echo "${REGISTRY}/${IMAGE_PREFIX}" | tr '[:upper:]' '[:lower:]')
          echo "backend=${prefix}/backend:${APPLICATION_SOURCE_SHA}-production" >> "$GITHUB_OUTPUT"
          echo "frontend=${prefix}/frontend:${APPLICATION_SOURCE_SHA}-production" >> "$GITHUB_OUTPUT"

      - name: Build and push backend
        id: backend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: backend/Dockerfile
          push: true
          platforms: linux/amd64
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.backend }}
          cache-from: type=gha,scope=backend-production
          cache-to: type=gha,mode=max,scope=backend-production

      - name: Build and push frontend
        id: frontend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          platforms: linux/amd64
          provenance: mode=max
          sbom: true
          build-args: |
            APP_BASE_URL=https://easy-scraping.com
            BUILD_ID=${{ env.APPLICATION_SOURCE_SHA }}
            SEO_INDEXING_ENABLED=true
            SEARCH_CONSOLE_VERIFICATION=${{ vars.SEARCH_CONSOLE_VERIFICATION }}
            ADS_ENABLED=${{ github.event_name == 'workflow_dispatch' && inputs.enable_ads == false && 'false' || 'true' }}
            ADSENSE_PUBLISHER_ID=ca-pub-5220225531544323
            ADSENSE_HOME_SLOT=2118692561
          tags: ${{ steps.meta.outputs.frontend }}
          cache-from: type=gha,scope=frontend-production
          cache-to: type=gha,mode=max,scope=frontend-production

      - name: Publish attested production-ready signal
        id: production
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          payload="$(jq -n \
            --arg ref "$APPLICATION_SOURCE_SHA" \
            --arg description "Attested application source passed isolated Test for repository head $REPOSITORY_HEAD_SHA" \
            '{ref:$ref,environment:"production-ready",auto_merge:false,required_contexts:[],description:$description}')"
          deployment_id="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/deployments" --input - --jq '.id' <<<"$payload")"
          status_payload="$(jq -n '{state:"success",environment:"production-ready",description:"Production images are ready from an attested Test candidate",auto_inactive:false}')"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/deployments/${deployment_id}/statuses" --input - <<<"$status_payload" >/dev/null
          echo "id=$deployment_id" >> "$GITHUB_OUTPUT"

      - name: Write immutable production release manifest
        shell: bash
        env:
          BACKEND_IMAGE: ${{ steps.meta.outputs.backend }}
          FRONTEND_IMAGE: ${{ steps.meta.outputs.frontend }}
          BACKEND_DIGEST: ${{ steps.backend.outputs.digest }}
          FRONTEND_DIGEST: ${{ steps.frontend.outputs.digest }}
          PRODUCTION_DEPLOYMENT_ID: ${{ steps.production.outputs.id }}
          CANDIDATE_RUN_ID: ${{ needs.prepare.outputs.candidate_run_id }}
        run: |
          set -euo pipefail
          [[ "$BACKEND_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$FRONTEND_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          jq -n \
            --argjson candidateRunId "$CANDIDATE_RUN_ID" \
            --arg repositoryHeadSha "$REPOSITORY_HEAD_SHA" \
            --arg applicationSourceSha "$APPLICATION_SOURCE_SHA" \
            --arg migrationSetHash "$MIGRATION_SET_HASH" \
            --arg backendCandidateDigest "$BACKEND_CANDIDATE_DIGEST" \
            --arg frontendCandidateDigest "$FRONTEND_CANDIDATE_DIGEST" \
            --argjson testDeploymentId "$TEST_DEPLOYMENT_ID" \
            --arg backendImage "$BACKEND_IMAGE" \
            --arg backendDigest "$BACKEND_DIGEST" \
            --arg frontendImage "$FRONTEND_IMAGE" \
            --arg frontendDigest "$FRONTEND_DIGEST" \
            --argjson productionDeploymentId "$PRODUCTION_DEPLOYMENT_ID" \
            --arg createdAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{schemaVersion:1,candidateRunId:$candidateRunId,repositoryHeadSha:$repositoryHeadSha,applicationSourceSha:$applicationSourceSha,migrationSetHash:$migrationSetHash,backendCandidateDigest:$backendCandidateDigest,frontendCandidateDigest:$frontendCandidateDigest,testDeploymentId:$testDeploymentId,backendImage:$backendImage,backendDigest:$backendDigest,frontendImage:$frontendImage,frontendDigest:$frontendDigest,productionDeploymentId:$productionDeploymentId,createdAt:$createdAt}' \
            > production-release-manifest.json

      - name: Upload immutable production release manifest
        uses: actions/upload-artifact@v4
        with:
          name: production-release-manifest
          path: production-release-manifest.json
          if-no-files-found: error
          retention-days: 90

      - name: Write release summary
        shell: bash
        run: |
          {
            echo '## Production images ready after attested isolated-Test gate'
            echo
            echo "- repository head: \`${REPOSITORY_HEAD_SHA}\`"
            echo "- application source: \`${APPLICATION_SOURCE_SHA}\`"
            echo "- candidate run: \`${{ needs.prepare.outputs.candidate_run_id }}\`"
            echo "- migration-set hash: \`${MIGRATION_SET_HASH}\`"
            echo "- backend: \`${{ steps.meta.outputs.backend }}@${{ steps.backend.outputs.digest }}\`"
            echo "- frontend: \`${{ steps.meta.outputs.frontend }}@${{ steps.frontend.outputs.digest }}\`"
            echo "- isolated-Test deployment id: \`${TEST_DEPLOYMENT_ID}\`"
            echo "- production-ready deployment id: \`${{ steps.production.outputs.id }}\`"
            echo '- reviewed public-page advertising defaults to enabled; manual dispatch may explicitly disable it.'
            echo '- GitOps automation may promote only the application source and evidence in production-release-manifest.json.'
          } >> "$GITHUB_STEP_SUMMARY"
