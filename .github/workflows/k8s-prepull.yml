name: Kubernetes Image Prepull

on:
  workflow_dispatch:
    inputs:
      backend_image:
        description: Fully qualified backend image
        required: true
        type: string
      frontend_image:
        description: Fully qualified frontend image
        required: true
        type: string

jobs:
  prepull:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Open SSH session to Kubernetes host
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<'CONFIG'
          Host target
            HostName ${{ secrets.DEPLOY_HOST }}
            User ${{ secrets.DEPLOY_USER }}
            Port ${{ secrets.DEPLOY_PORT }}
            IdentityFile ~/.ssh/deploy
            IdentitiesOnly yes
            IdentityAgent none
            BatchMode yes
            StrictHostKeyChecking yes
          CONFIG
          chmod 600 ~/.ssh/config
          ssh target 'command -v sudo >/dev/null && sudo -n true && command -v ctr >/dev/null && command -v kubectl >/dev/null'
      - name: Prepull production images into k8s containerd
        env:
          BACKEND_IMAGE: ${{ inputs.backend_image }}
          FRONTEND_IMAGE: ${{ inputs.frontend_image }}
          GHCR_USER: ${{ github.repository_owner }}
          GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          printf -v q_backend '%q' "$BACKEND_IMAGE"
          printf -v q_frontend '%q' "$FRONTEND_IMAGE"
          printf -v q_user '%q' "$GHCR_USER"
          printf -v q_token '%q' "$GHCR_TOKEN"
          ssh target "sudo ctr -n k8s.io images pull --user ${q_user}:${q_token} ${q_backend} >/dev/null && sudo ctr -n k8s.io images pull --user ${q_user}:${q_token} ${q_frontend} >/dev/null"
      - name: Verify cached images
        env:
          BACKEND_IMAGE: ${{ inputs.backend_image }}
          FRONTEND_IMAGE: ${{ inputs.frontend_image }}
        run: |
          printf -v q_backend '%q' "$BACKEND_IMAGE"
          printf -v q_frontend '%q' "$FRONTEND_IMAGE"
          ssh target "sudo ctr -n k8s.io images check ${q_backend} ${q_frontend} >/dev/null"
