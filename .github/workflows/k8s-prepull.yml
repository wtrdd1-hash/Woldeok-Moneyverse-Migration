name: Kubernetes Image Prepull

on:
  workflow_dispatch:
    inputs:
      backend_image:
        description: Fully qualified backend image
        required: true
        type: string
      frontend_image:
        description: Fully qualified frontend image
        required: true
        type: string

jobs:
  prepull:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Open SSH session to Kubernetes host
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<'CONFIG'
          Host target
            HostName ${{ secrets.DEPLOY_HOST }}
            User ${{ secrets.DEPLOY_USER }}
            Port ${{ secrets.DEPLOY_PORT }}
            IdentityFile ~/.ssh/deploy
            IdentitiesOnly yes
            IdentityAgent none
            BatchMode yes
            StrictHostKeyChecking yes
          CONFIG
          chmod 600 ~/.ssh/config
          ssh target 'mkdir -p /tmp/wdmv-image-stage && chmod 700 /tmp/wdmv-image-stage'
      - name: Pull private production images
        env:
          GHCR_USER: ${{ github.repository_owner }}
          GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          BACKEND_IMAGE: ${{ inputs.backend_image }}
          FRONTEND_IMAGE: ${{ inputs.frontend_image }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin
          docker pull "$BACKEND_IMAGE"
          docker pull "$FRONTEND_IMAGE"
          docker save "$BACKEND_IMAGE" | gzip -1 > /tmp/wdmv-backend.tar.gz
          docker save "$FRONTEND_IMAGE" | gzip -1 > /tmp/wdmv-frontend.tar.gz
      - name: Stage image archives on Kubernetes host
        run: |
          scp /tmp/wdmv-backend.tar.gz target:/tmp/wdmv-image-stage/backend.tar.gz
          scp /tmp/wdmv-frontend.tar.gz target:/tmp/wdmv-image-stage/frontend.tar.gz
          ssh target 'sha256sum /tmp/wdmv-image-stage/backend.tar.gz /tmp/wdmv-image-stage/frontend.tar.gz'
