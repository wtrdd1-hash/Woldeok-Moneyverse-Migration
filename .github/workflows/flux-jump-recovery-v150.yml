name: Cluster SSH Recovery v179

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Recovery mode
        required: true
        default: direct-recover
        type: choice
        options: [direct-recover]
      restart_flux_controllers:
        description: Reserved compatibility input
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  recover-direct:
    runs-on: [self-hosted, moneyverse-deploy, debian13]
    environment: production
    timeout-minutes: 10
    steps:
      - name: Prepare deployment identity
        shell: bash
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          [[ -n "${DEPLOY_USER:-}" && -n "${DEPLOY_SSH_KEY:-}" ]]
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          ssh-keygen -y -f ~/.ssh/deploy > ~/.ssh/deploy.pub
          echo "Deploy public-key fingerprint: $(ssh-keygen -lf ~/.ssh/deploy.pub | awk '{print $2}')"

      - name: Probe Kubernetes and Proxmox recovery principals
        id: probe
        shell: bash
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          printf '%s\n' \
            '192.168.100.186 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIP2tRZ2fc3s0TLNeY2fRNKcz2oYylnh4xFl+y+oM/VCp' \
            '192.168.100.1 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJkus4jAYChCY44x5smQbNEfeTzq3XWNj2lnpbrNhsEG' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          common=(-i "$HOME/.ssh/deploy" -o IdentitiesOnly=yes -o IdentityAgent=none -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=5)
          target_user=''
          for candidate in root nixos "$DEPLOY_USER"; do
            [[ -n "$candidate" ]] || continue
            if ssh "${common[@]}" "$candidate@192.168.100.186" true >/dev/null 2>&1; then target_user="$candidate"; break; fi
          done
          if [[ -n "$target_user" ]]; then
            echo 'target_ok=true' >> "$GITHUB_OUTPUT"
            echo "target_user=$target_user" >> "$GITHUB_OUTPUT"
            echo "Kubernetes target authentication succeeded as ${target_user}."
          else
            echo 'target_ok=false' >> "$GITHUB_OUTPUT"
            echo 'Kubernetes target key is absent; checking Proxmox root recovery path.'
          fi
          if ssh "${common[@]}" root@192.168.100.1 true >/dev/null 2>&1; then
            echo 'pve_root_ok=true' >> "$GITHUB_OUTPUT"
            echo 'Proxmox root SSH authentication succeeded.'
            ssh "${common[@]}" root@192.168.100.1 'hostname; pveversion; qm list'
          else
            echo 'pve_root_ok=false' >> "$GITHUB_OUTPUT"
            echo 'Proxmox root SSH authentication failed.'
          fi
          [[ -n "$target_user" || "$(ssh "${common[@]}" root@192.168.100.1 true >/dev/null 2>&1; echo $?)" == 0 ]]

      - name: Cleanup deployment identity
        if: always()
        shell: bash
        run: rm -f ~/.ssh/deploy ~/.ssh/deploy.pub ~/.ssh/known_hosts
