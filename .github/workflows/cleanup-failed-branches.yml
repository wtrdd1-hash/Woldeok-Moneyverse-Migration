name: Cleanup Repeatedly Failing Branches

on:
  workflow_run:
    workflows: [Build Test Candidate]
    types: [completed]
  schedule:
    - cron: '12,42 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: cleanup-repeatedly-failing-branches
  cancel-in-progress: false

jobs:
  cleanup:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Keep repeatedly failing work for repair without deleting branches
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          retained=0
          wip_skipped=0

          mapfile -t branches < <(
            gh api --paginate "repos/${REPO}/branches?per_page=100" --jq '.[].name' | sort
          )

          for branch in "${branches[@]}"; do
            case "$branch" in
              main|production|staging|develop|release/*|planning/*) continue ;;
              feat/*|feature/*|fix/*|bugfix/*|integrate/*|ops/*|auto/*|test-candidate/*|security/*|docs/*) ;;
              *) continue ;;
            esac

            encoded="$(jq -rn --arg v "$branch" '$v|@uri')"
            branch_sha="$(gh api "repos/${REPO}/branches/${encoded}" --jq '.commit.sha' 2>/dev/null || true)"
            [[ -n "$branch_sha" ]] || continue

            compare="$(gh api "repos/${REPO}/compare/main...${encoded}" 2>/dev/null || true)"
            [[ -n "$compare" ]] || continue
            ahead="$(jq -r '.ahead_by // 0' <<<"$compare")"
            [[ "$ahead" -gt 0 ]] || continue

            failed_count="$(
              gh api --method GET "repos/${REPO}/actions/workflows/test-candidate.yml/runs" \
                -f branch="$branch" -f status=completed -f per_page=50 \
                --jq "[.workflow_runs[] | select(.head_sha == \"${branch_sha}\" and .conclusion == \"failure\")] | length"
            )"
            [[ "$failed_count" -ge 3 ]] || continue

            pr="$(
              gh api --method GET "repos/${REPO}/pulls" \
                -f state=open -f base=main -f head="${GITHUB_REPOSITORY_OWNER}:${branch}" -f per_page=10 \
                --jq '.[0].number // empty'
            )"

            if [[ -z "$pr" ]]; then
              wip_skipped=$((wip_skipped + 1))
              echo "retain active branch with no open PR: ${branch}"
              continue
            fi

            pr_json="$(gh api "repos/${REPO}/pulls/${pr}")"
            draft="$(jq -r '.draft // false' <<<"$pr_json")"
            blocked_label="$(jq -r '[.labels[].name | ascii_downcase] | any(. == "wip" or . == "work-in-progress" or . == "work in progress" or . == "do-not-merge" or . == "do not merge" or . == "hold" or . == "merge-blocked" or . == "in-progress")' <<<"$pr_json")"
            if [[ "$draft" == "true" || "$blocked_label" == "true" ]]; then
              wip_skipped=$((wip_skipped + 1))
              echo "retain work-in-progress PR #${pr}: ${branch}"
              continue
            fi

            retained=$((retained + 1))
            echo "::warning::ready PR #${pr} exact SHA ${branch_sha} failed candidate validation ${failed_count} times; keep branch/PR for repair and later automatic integration"
          done

          {
            echo '## Repeated-failure retention summary'
            echo
            echo "- ready PRs retained for repair: ${retained}"
            echo "- work-in-progress branches/PRs skipped: ${wip_skipped}"
            echo '- no repeatedly failing branch is automatically deleted; repair and revalidation must precede main integration'
          } >> "$GITHUB_STEP_SUMMARY"

