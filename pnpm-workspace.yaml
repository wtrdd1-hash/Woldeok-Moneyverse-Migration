packages:
  - frontend
  - backend
  - packages/*
  - services/*

# next pins postcss 8.4.31, which sits under two high-severity advisories
# (GHSA-6g55-p6wh-862q, GHSA-r28c-9q8g-f849): a sourceMappingURL in a CSS
# comment can make PostCSS read an arbitrary file. Nothing here compiles CSS an
# outsider wrote, so the exposure is small -- but `pnpm audit --prod
# --audit-level=high` is a release gate now, and silencing a gate to keep it
# green is how gates stop meaning anything. 8.5.x is a semver-minor move.
#
# Declared here AND in package.json's `pnpm.overrides` on purpose: pnpm 10.0.0,
# which packageManager pins and CI installs, reads the package.json field;
# pnpm 10.6+ reads this file and ignores that one. Whichever runs, the pin
# holds.
overrides:
  postcss: '>=8.5.18'
  fast-uri: 3.1.8
  'brace-expansion@^1.0.0': 1.1.20
  'brace-expansion@^5.0.0': 5.0.11
  vite: 7.3.7
