server:
  port: ${PORT:4550}
  servlet:
    context-path: /

spring:
  application:
    name: moneyverse-spring-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5432/woldeok_moneyverse}
    username: ${SPRING_DATASOURCE_USERNAME:debian}
    password: ${SPRING_DATASOURCE_PASSWORD:debian}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

moneyverse:
  # Explicitly OFF: no existing public route is switched to Spring by default.
  web:
    spring-home-enabled: ${MONEYVERSE_SPRING_HOME_ENABLED:false}
    spring-guide-enabled: ${MONEYVERSE_SPRING_GUIDE_ENABLED:false}
  security:
    internal-token: ${INTERNAL_API_TOKEN:8e5f2a1b9c3d4e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f}
    admin-role: ROLE_ADMIN
  features:
    swf-operational: ${MONEYVERSE_SWF_OPERATIONAL:true}
    kdic-operational: ${MONEYVERSE_KDIC_OPERATIONAL:true}
    black-market-operational: ${MONEYVERSE_BLACK_MARKET_OPERATIONAL:true}
    pension-operational: ${MONEYVERSE_PENSION_OPERATIONAL:true}
  socket:
    host: ${SOCKETIO_HOST:0.0.0.0}
    port: ${SOCKETIO_PORT:9092}
    boss-threads: 1
    worker-threads: 4
    ping-interval: 25000
    ping-timeout: 60000
    max-frame-payload-length: 1048576
  discord:
    bot-token: ${DISCORD_BOT_TOKEN:}
    log-channel-id: ${DISCORD_LOG_CHANNEL_ID:1542465347364589609}
    admin-user-id: ${DISCORD_ADMIN_ALERT_USER_ID:889085646768078850}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
