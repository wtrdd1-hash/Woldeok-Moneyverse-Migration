server:
  port: ${PORT:4550}
  servlet:
    context-path: /

spring:
  application:
    name: moneyverse-spring-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5432/woldeok_moneyverse}
    username: ${SPRING_DATASOURCE_USERNAME:debian}
    password: ${SPRING_DATASOURCE_PASSWORD:debian}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000
  jpa:
    # Off: with it on, a JPA transaction early in a request held its connection until the
    # response while JdbcTemplate borrowed a second one, deadlocking the pool at ~pool-size
    # concurrent requests (capacity sandbox 2026-11-26). No entity needs a session across views.
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

moneyverse:
  security:
    internal-token: ${INTERNAL_API_TOKEN:}
    admin-role: ROLE_ADMIN
  features:
    swf-operational: ${MONEYVERSE_SWF_OPERATIONAL:true}
    kdic-operational: ${MONEYVERSE_KDIC_OPERATIONAL:true}
    black-market-operational: ${MONEYVERSE_BLACK_MARKET_OPERATIONAL:true}
    pension-operational: ${MONEYVERSE_PENSION_OPERATIONAL:true}
  socket:
    host: ${SOCKETIO_HOST:127.0.0.1}
    port: ${SOCKETIO_PORT:9092}
    boss-threads: 1
    worker-threads: 4
    ping-interval: 25000
    ping-timeout: 60000
    max-frame-payload-length: 1048576
  discord:
    client-id: ${DISCORD_CLIENT_ID:}
    client-secret: ${DISCORD_CLIENT_SECRET:}
    redirect-uri: ${DISCORD_REDIRECT_URI:https://easy-scraping.com/auth/discord/callback}
    bot-token: ${DISCORD_BOT_TOKEN:}
    log-channel-id: ${DISCORD_LOG_CHANNEL_ID:1542465347364589609}
    admin-user-id: ${DISCORD_ADMIN_ALERT_USER_ID:889085646768078850}
    voice-guild-id: ${DISCORD_VOICE_GUILD_ID:1104015535592701984}
    voice-channel-id: ${DISCORD_VOICE_CHANNEL_ID:1536572442422550538}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_REDIRECT_URI:https://easy-scraping.com/auth/google/callback}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

# The API description is off unless an operator opts in for a local session. Production and
# Test never publish it: it maps every route, including ones the edge deliberately hides.
springdoc:
  api-docs:
    enabled: ${MONEYVERSE_API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${MONEYVERSE_API_DOCS_ENABLED:false}
