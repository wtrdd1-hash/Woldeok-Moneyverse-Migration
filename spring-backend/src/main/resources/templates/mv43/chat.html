<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:lang="${uiLanguage}" th:attr="data-ui-language=${uiLanguage}">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="dark"><meta name="theme-color" content="#0C1020">
<title th:text="${uiCopy['msgChat']} + ' · W Moneyverse'">Direct Messages · W Moneyverse</title>
<link rel="stylesheet" href="/assets/mv39/site.css?v=014db2fb80894d65243679662aa7abb859ced8787b8e6e62071936001533da31"><link rel="stylesheet" href="/assets/mv43/messaging.css?v=dc447871eaa3be68bb5e20a885f7e820717d0c0ad37a6c67e8843310b805db03">
<script src="/assets/mv39/i18n.js?v=67b80fde2fdda66f1e777d9d03a84821b46ed71e7c64e8efd4de08726e05d108" defer></script><script src="/assets/mv43/messaging-core.js?v=a058cd73b51fa3d2dd704e4aefce9830e03bc1631c1dc51869a5eb6d3a84ead3" defer></script><script src="/assets/mv43/messaging.js?v=fcc140b10034704ed12012066e4b5354e99699a5651c7757eab6a9cd7b747388" defer></script>
<th:block th:replace="~{shared/chrome :: commonHead}"></th:block></head>
<body data-page="chat"><a class="skip-link" href="#main-content" data-i18n="authSkip" th:text="${uiCopy['authSkip']}">Skip to main content</a>
<div class="app-shell"><th:block th:replace="~{shared/chrome :: sidebar}"></th:block><div class="app-main"><div class="app-inner">
<th:block th:replace="~{shared/chrome :: pageHeader}"></th:block>
<main id="main-content" tabindex="-1"><section class="hero"><div><h2  data-i18n="msgChat" th:text="${uiCopy['msgChat']}">Direct Messages</h2><p  data-i18n="msgChatLead" th:text="${uiCopy['msgChatLead']}">Private 1:1 conversations with members. Only existing conversations are available here.</p></div></section>
<section id="messaging-root" class="messaging" data-kind="chat">
<p id="messaging-status" role="status" aria-live="polite" th:text="${uiCopy['loading']}">Loading verified data…</p>
<button id="messaging-refresh" type="button" data-i18n="refresh" th:text="${uiCopy['refresh']}">Refresh</button>
<div id="messaging-private" hidden><div class="messaging-grid"><aside class="card messaging-sidebar"><label for="chat-search" data-i18n="msgChatSearch" th:text="${uiCopy['msgChatSearch']}">Search existing conversations</label><input id="chat-search" name="chat-search" autocomplete="off" type="search" maxlength="80">
<button id="chat-new" type="button" disabled aria-describedby="messaging-unavailable" data-i18n="msgNewDm" th:text="${uiCopy['msgNewDm']}">New message</button><button id="chat-archived" type="button" disabled aria-describedby="messaging-unavailable" data-i18n="msgArchived" th:text="${uiCopy['msgArchived']}">Archived conversations</button><p id="chat-unread">—</p><div id="messaging-list" class="messaging-list"></div></aside><section class="card messaging-room"><h3 id="message-heading" th:text="${uiCopy['msgHistory']}">Conversation history</h3><button id="chat-back" type="button" data-i18n="msgBack" th:text="${uiCopy['msgBack']}">Back to conversations</button><div class="messaging-tools"><button id="chat-archive" type="button" disabled aria-describedby="messaging-unavailable" data-i18n="msgArchive" th:text="${uiCopy['msgArchive']}">Archive conversation</button><button id="chat-mute" type="button" disabled aria-describedby="messaging-unavailable" data-i18n="msgMute" th:text="${uiCopy['msgMute']}">Mute notifications</button><button id="chat-block" type="button" disabled aria-describedby="messaging-unavailable" data-i18n="msgBlock" th:text="${uiCopy['msgBlock']}">Block member</button><button id="chat-unblock" type="button" disabled aria-describedby="messaging-unavailable" data-i18n="msgUnblock" th:text="${uiCopy['msgUnblock']}">Unblock member</button><button id="chat-report" type="button" disabled aria-describedby="messaging-unavailable" data-i18n="msgReport" th:text="${uiCopy['msgReport']}">Report conversation</button><button id="chat-upload" type="button" disabled aria-describedby="messaging-unavailable" data-i18n="msgUpload" th:text="${uiCopy['msgUpload']}">Attach image</button></div><div id="message-history" class="message-history" role="region" aria-labelledby="message-heading" tabindex="0"></div>
<form id="message-form" method="post"><label for="message-body" data-i18n="msgBody" th:text="${uiCopy['msgBody']}">Message</label><textarea id="message-body" name="body" autocomplete="off" required disabled rows="3" aria-describedby="message-body-count"></textarea><output id="message-body-count" for="message-body">0 / 1,000</output>
<button id="message-send" type="submit" disabled th:text="${uiCopy['msgSend']}">Send</button></form>
<p id="messaging-result" role="status" aria-live="polite"></p></section></div></div><p id="messaging-unavailable" class="messaging-note" data-i18n="msgMissing" th:text="${uiCopy['msgMissing']}">These actions are currently unavailable. Select an existing conversation to view its history or send a reply.</p></section></main><th:block th:replace="~{shared/chrome :: footer}"></th:block></div></div></div>
<th:block th:replace="~{shared/chrome :: mobileNavigation}"></th:block><th:block th:replace="~{shared/chrome :: support}"></th:block></body></html>
