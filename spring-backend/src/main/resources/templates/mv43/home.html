<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:lang="${uiLanguage}" th:attr="data-ui-language=${uiLanguage}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0C1020">
  <meta name="description" content="W Moneyverse — personal finance, investing, quests and community">
  <title th:text="${uiCopy[uiPageKey == 'home' ? 'personalTitle' : uiPageKey]} + ' · W Moneyverse'">My assets · W Moneyverse</title>
  <link rel="stylesheet" href="/assets/mv39/site.css?v=014db2fb80894d65243679662aa7abb859ced8787b8e6e62071936001533da31">
  <script src="/assets/mv39/i18n.js?v=8c7cf8e55c170e6b527f93eaf8ce5a4b6e6e16034e35566fd9e1092a710d4fec" defer></script>
  <script src="/assets/mv39/money.js?v=9e95a9188599bc8d14d9743b3506f68af9fd17a63c6dd7db471e0d077d9283d5" defer></script>
  <script src="/assets/mv39/app.js?v=dd1448ca8e6f4b4cb585e0a1ee199a523b3b503f3df2b8be562058bbe897a9d4" defer></script>
  <th:block th:replace="~{shared/chrome :: commonHead}"></th:block>
</head>
<body data-page="home" th:attr="data-page=${uiPageKey}">
<a class="skip-link" href="#main-content" data-i18n="authSkip" th:text="${uiCopy['authSkip']}">Skip to main content</a>
<div class="app-shell">
  <th:block th:replace="~{shared/chrome :: sidebar}"></th:block>
  <div class="app-main">
    <div class="app-inner">
      <th:block th:replace="~{shared/chrome :: pageHeader}"></th:block>
      <main id="main-content" tabindex="-1">
        <section class="hero" aria-labelledby="hero-title">
          <div><div class="eyebrow"><span aria-hidden="true">✦</span> WOLDEOK MONEYVERSE</div><h2 id="hero-title" th:attr="data-i18n=${uiPageKey == 'home' ? 'personalTitle' : uiPageKey + 'Hero'}" th:text="${uiCopy[uiPageKey == 'home' ? 'personalTitle' : uiPageKey + 'Hero']}">My assets</h2><p id="hero-description" th:attr="data-i18n=${uiPageKey + 'Lead'}" th:text="${uiCopy[uiPageKey + 'Lead']}">See your wallet, investments and activity in one place.</p></div>
          <div class="hero-decoration" aria-hidden="true"><span class="realm-orbit"><span class="realm-core"><img src="/assets/mv39/favicon.ico?v=7c17c9be67fb26d74879b5392423e736ed7079a3c00e5a203adcecddf35fa3d5" width="120" height="120" alt=""></span></span></div>
        </section>
        <!-- Static policy summary only: never substitute this for a verified current game clock response. -->
        <section class="game-clock-guide" aria-labelledby="game-clock-rule-title">
          <div>
            <h3 id="game-clock-rule-title" class="game-clock-guide__title" data-i18n="gameClockTitle" th:text="${uiCopy['gameClockTitle']}">Server game time rules</h3>
            <p class="game-clock-guide__note" data-i18n="gameClockNote" th:text="${uiCopy['gameClockNote']}">Planned rule; live calendar unverified.</p>
          </div>
          <div class="game-clock-guide__ratios" aria-label="Game time conversion rule" data-i18n-aria="gameClockConversion" th:attr="aria-label=${uiCopy['gameClockConversion']}">
            <span data-i18n="gameClockRealMinutes" th:text="${uiCopy['gameClockRealMinutes']}">10 real min</span><b>=</b>
            <span data-i18n="gameClockServerDay" th:text="${uiCopy['gameClockServerDay']}">1 server day</span>
            <span data-i18n="gameClockServerWeek" th:text="${uiCopy['gameClockServerWeek']}">7 server days = 1 week</span>
          </div>
        </section>
        <div id="page-content" aria-live="polite"></div>
      </main>
      <th:block th:replace="~{shared/chrome :: footer}"></th:block>
    </div>
  </div>
</div>
<th:block th:replace="~{shared/chrome :: mobileNavigation}"></th:block>
<th:block th:replace="~{shared/chrome :: support}"></th:block>
</body>
</html>
