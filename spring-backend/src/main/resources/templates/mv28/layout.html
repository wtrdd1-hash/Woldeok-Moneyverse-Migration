<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <meta name="description" content="Woldeok Moneyverse Spring native calculators, no login required, with accessible standard HTML forms.">
  <title th:text="${pageTitle} + ' | Woldeok Moneyverse'">Woldeok Moneyverse</title>
  <link rel="stylesheet" href="/mv-spring/v28/styles.css">
  <link rel="stylesheet" href="/mv-spring/v38/shared-ui.css">
</head>
<body>
<header class="site-header" th:fragment="header">
  <div class="shell header-row">
    <a class="brand" href="/" aria-label="Woldeok Moneyverse home"><span class="brand-symbol" aria-hidden="true">W</span><span>WOLDEOK <b>MONEYVERSE</b></span></a>
    <nav class="nav" aria-label="Main navigation">
      <a href="/tools" th:text="${ko} ? '계산기' : 'Calculators'">Calculators</a>
      <a href="/stocks" th:text="${ko} ? '거래소' : 'Market'">Market</a>
      <a href="/shop" th:text="${ko} ? '상점' : 'Shop'">Shop</a>
      <a href="/guide" th:text="${ko} ? '안내' : 'Guide'">Guide</a>
    </nav>
    <div class="nav-actions">
      <a class="language" th:href="@{${calculatorPath}(lang='en')}" hreflang="en" th:attr="aria-current=${ko} ? null : 'page'">EN</a>
      <a class="language" th:href="@{${calculatorPath}(lang='ko')}" hreflang="ko" th:attr="aria-current=${ko} ? 'page' : null">KO</a>
    </div>
  </div>
</header>
<footer th:fragment="footer" class="site-footer">
  <div class="shell footer-row">
    <p>© Woldeok Moneyverse <span class="footer-tag">Spring MVC · Native Web · v28</span></p>
    <nav aria-label="Footer"><a href="/privacy" th:text="${ko} ? '개인정보' : 'Privacy'">Privacy</a><a href="/terms" th:text="${ko} ? '이용약관' : 'Terms'">Terms</a><a href="/support" th:text="${ko} ? '지원' : 'Support'">Support</a></nav>
  </div>
  <!-- v38: Spring-only no-JavaScript help; no unverified member message transport. -->
  <details class="mv-support-dock">
    <summary th:attr="aria-label=${ko} ? '문의 및 고객지원 열기' : 'Open support and help'">
      <span aria-hidden="true">?</span><span th:text="${ko} ? '문의' : 'Help'">Help</span>
    </summary>
    <section class="mv-support-panel" th:attr="aria-label=${ko} ? '고객지원 안내' : 'Support information'">
      <h2 th:text="${ko} ? '도움 및 문의' : 'Help and support'">Help and support</h2>
      <p class="mv-support-warning" th:text="${ko} ? '보안 확인 전 채팅 메시지 전송은 제공하지 않습니다. 실제 문의는 고객센터를 확인하세요.' : 'Chat message sending is disabled pending security verification. Use the support center for available contact options.'">Chat unavailable pending security verification / 보안 확인 전 전송 비활성</p>
      <nav aria-label="Support destinations">
        <a href="/support" th:text="${ko} ? '고객센터 보기' : 'Open support center'">Open support center</a>
        <a href="/help" th:text="${ko} ? '도움말 보기' : 'Open help'">Open help</a>
      </nav>
    </section>
  </details>
</footer>
</body>
</html>
