spring:
  application:
    name: moneyverse-spring-backend-test
  datasource:
    url: jdbc:h2:mem:moneyverse_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-test.sql
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

moneyverse:
  storage:
    path: ${java.io.tmpdir}/moneyverse-test-media-${random.uuid}
  security:
    internal-token: test-internal-token
  features:
    swf-operational: true
    kdic-operational: true
    black-market-operational: true
    pension-operational: true
  socket:
    host: 127.0.0.1
    port: 0
    boss-threads: 1
    worker-threads: 2
    ping-interval: 25000
    ping-timeout: 60000
  discord:
    bot-token: ""
    log-channel-id: "1542465347364589609"
    admin-user-id: "889085646768078850"
