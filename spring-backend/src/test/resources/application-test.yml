spring:
  application:
    name: moneyverse-spring-backend-test
  datasource:
    url: jdbc:h2:mem:moneyverse_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

moneyverse:
  security:
    internal-token: test-internal-token
  features:
    swf-operational: true
    kdic-operational: true
    black-market-operational: true
    pension-operational: true
