# v2026.11.17.14 isolated loopback-only Nginx test: no public traffic.
pid /tmp/moneyverse-seo-upstream-test-v20261117-14.pid;
error_log /tmp/moneyverse-seo-upstream-test-v20261117-14.error.log info;
events { worker_connections 64; }
http {
    upstream mv_test_seo_next { server 127.0.0.1:4521; }
    upstream mv_test_auth_next { server 127.0.0.1:4501; }
    upstream mv_test_spring { server 127.0.0.1:4550; }
    server {
        listen 127.0.0.1:18521;
        server_name localhost;

        location = /__auth {
            internal;
            proxy_pass http://mv_test_auth_next/api/admin/seo/status;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Host easy-scraping.com;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Cookie $http_cookie;
        }
        location = /admin/seo {
            auth_request /__auth;
            proxy_pass http://mv_test_seo_next;
            proxy_set_header Host easy-scraping.com;
            proxy_set_header X-Forwarded-Proto https;
            add_header Cache-Control "private, no-store" always;
            add_header X-Robots-Tag "noindex, nofollow" always;
        }
        location = /admin/seo-audit {
            auth_request /__auth;
            proxy_pass http://mv_test_seo_next;
            proxy_set_header Host easy-scraping.com;
            proxy_set_header X-Forwarded-Proto https;
            add_header Cache-Control "private, no-store" always;
            add_header X-Robots-Tag "noindex, nofollow" always;
        }
        location = /__test-render {
            # Bound to 127.0.0.1 only; inspect the candidate's HTML independently of auth.
            proxy_pass http://mv_test_seo_next/admin/seo;
            proxy_set_header Host easy-scraping.com;
            proxy_set_header X-Forwarded-Proto https;
        }
        location = /health {
            proxy_pass http://mv_test_spring/health;
            proxy_set_header Host easy-scraping.com;
        }
    }
}
